<style>
:root{
  /* Seattle Kraken: Deep Sea Blue (#001628) base, Boundless/Ice Blue accents, Red Alert (#E9072B) */
  /* ===== Two brand colors ===== */
  --deep:#001628;          /* deep sea blue - every dark surface + primary text/links */
  --deep-2:#001628;        /* kept as an alias of deep (was a 2nd gradient blue) */
  --accent:#8dd2d1;        /* seafoam - the single accent */
  --accent-700:#5cbfbd;    /* darker seafoam, primary-button hover */
  --accent-bg:#e8f7f6;     /* soft seafoam tint, highlights/hovers */
  /* legacy blue names repointed onto the two brand colors */
  --navy:#001628; --navy-700:#001628; --navy-600:#001628;
  --blue:#001628; --blue-500:#001628;
  --sky:#8dd2d1; --boundless:#8dd2d1; --ice:#8dd2d1;
  --sky-300:#aadedc; --sky-200:#cdeceb; --sky-100:#e8f7f6; --sky-50:#f1faf9;
  --ice-bg:#e8f7f6;
  /* neutrals - light blue-grey, harmonize with both brand colors */
  --bg:#ffffff; --panel:#ffffff; --panel-2:#f7fbfb;
  --line:#e0efee; --line-strong:#c6e4e2; --gold:#f5c518; --gold-deep:#eab308;
  --ink:#03243c; --ink-soft:#2e4f68; --muted:#5f7a8c; --muted-2:#8fa6b4;
  /* semantic status colors - encode meaning (health / overdue / done), kept */
  --green:#11936a; --green-bg:#e3f5ee;
  --amber:#c2820f; --amber-bg:#fbefd6;
  --red:#e9072b; --red-bg:#fde2e6;
  --grey:#7e96a6; --grey-bg:#eef3f7;
  --shadow:0 1px 2px rgba(0,22,40,.04);
  --shadow-lg:0 16px 48px rgba(0,22,40,.20);
  --r:12px; --r-sm:8px; --r-lg:16px;
  --side:240px;
  --font:'Source Sans 3',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#root{min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3e0ea;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#bcccda}

/* ---------- App shell ---------- */
.app{display:block;min-height:100vh}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line-strong);padding:0 18px;height:52px}
.tb-logo{width:28px;height:28px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tb-app{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.tb-app:hover{background:var(--sky-50);border-color:var(--line)}
.tb-tabs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tb-tabs::-webkit-scrollbar{display:none}
.tb-tab{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;border:1px solid transparent;white-space:nowrap;flex:0 0 auto;transition:background .12s,color .12s,border-color .12s}
.tb-tab:hover{background:var(--sky-50);color:var(--deep)}
.tb-tab.on{background:var(--accent-bg);border-color:var(--line-strong);color:var(--deep)}
.tb-tab .badge{background:var(--red);color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:1px 6px;min-width:16px;text-align:center}
.tb-right{display:flex;align-items:center;gap:7px;margin-left:auto;flex:0 0 auto}
.tb-menu{position:absolute;top:calc(100% + 6px);background:#fff;border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:220}
.tb-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.tb-item:hover{background:var(--sky-50)}
.tb-item.on{background:var(--accent-bg)}
.tb-menu-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin-top:5px;padding:8px 10px 4px}
/* ---------- login ---------- */
.login{min-height:100vh;display:flex;background:#fff}
.login-left{flex:0 0 44%;max-width:620px;display:flex;flex-direction:column;padding:34px 56px 26px}
.login-brand{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--ink)}
.login-brand b{letter-spacing:-.2px}
.login-body{margin:auto 0;padding:40px 0;max-width:400px;width:100%;align-self:center}
.login-kicker{font-size:11.5px;font-weight:800;letter-spacing:.18em;color:var(--accent-700);text-transform:uppercase;margin-bottom:10px}
.login-h1{font-size:44px;letter-spacing:-1.4px;margin:0 0 12px;color:var(--ink);line-height:1.05}
.login-sub{font-size:14.5px;color:var(--muted);line-height:1.55;margin:0 0 26px}
.login-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;background:#fff;border:1px solid var(--line-strong);border-radius:10px;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.login-google:hover{background:var(--sky-50);border-color:var(--accent);box-shadow:0 2px 10px rgba(0,22,40,.06)}
.login-foot{padding-top:14px}
.login-right{flex:1;position:relative;overflow:hidden;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:34px 58px 50px}
.login-cards{position:relative;flex:1;min-height:150px;pointer-events:none;overflow:hidden}
.login-fc{position:absolute;background:#001628;border:1px solid #0a2f47;border-radius:14px;padding:16px;width:clamp(170px,15vw,250px);box-shadow:0 18px 44px rgba(0,22,40,.18)}
.login-fc .fc-dot{width:26px;height:26px;border-radius:50%;margin-bottom:12px}
.login-fc .fc-lines span{display:block;height:7px;border-radius:5px;background:rgba(255,255,255,.30);margin-bottom:7px}
.fc1{top:4%;left:6%;transform:rotate(-4deg)}
.fc2{top:38%;left:18%;transform:rotate(3deg)}
.fc3{top:68%;left:7%;transform:rotate(-2deg)}
.login-octo{position:absolute;right:4%;top:6%;width:clamp(170px,20vw,290px);transform:rotate(2deg)}
.login-pill{display:inline-block;align-self:flex-start;border:1px solid #001628;color:#fff;border-radius:999px;padding:7px 15px;font-size:11px;font-weight:800;letter-spacing:.14em;margin:30px 0 20px;background:#001628}
.login-big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.06;color:var(--ink);position:relative}

[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:300;pointer-events:none;box-shadow:0 4px 14px rgba(0,22,40,.18)}
.side{width:var(--side);flex:0 0 var(--side);background:#001628;color:#dbe9e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:32px;height:32px;border-radius:9px;background:#8dd2d1;display:flex;align-items:center;justify-content:center;font-weight:800;color:#001628;font-size:15px;box-shadow:inset 0 0 0 1px rgba(0,22,40,.12)}
.brand b{font-size:15px;color:#fff;letter-spacing:-.2px;display:block;line-height:1.1}
.brand small{font-size:11px;color:#8fc7c6;letter-spacing:.3px}
.appsw{flex:1;min-width:0}
.appsw-btn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:9px;padding:4px 7px;text-align:left;cursor:pointer;transition:background .12s,border-color .12s}
.appsw-btn:hover{background:rgba(141,210,209,.14);border-color:rgba(141,210,209,.28)}
.appsw-chev{margin-left:auto;color:#8fc7c6;font-size:16px;line-height:1;transition:transform .18s ease;flex:0 0 auto}
.appsw-chev.open{transform:rotate(90deg)}
.appsw-menu{position:absolute;top:calc(100% + 6px);left:0;width:248px;background:#062033;border:1px solid rgba(141,210,209,.25);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.5);padding:6px;z-index:200}
.appsw-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;color:#d3e7e6;text-align:left}
.appsw-item:hover{background:rgba(141,210,209,.14)}
.appsw-item.on{background:rgba(141,210,209,.18)}
.appsw-item b{display:block;color:#fff;font-size:13.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appsw-sub{display:block;font-size:10.5px;color:#8fc7c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appsw-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;box-shadow:0 0 0 3px rgba(141,210,209,.12)}
.hc-drawer{background:var(--panel);width:min(460px,96vw);height:100%;max-height:100vh;display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.18);animation:hcDrawerIn .18s ease}
@keyframes hcDrawerIn{from{transform:translateX(30px);opacity:.6}to{transform:translateX(0);opacity:1}}
.hc-drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.hc-drawer-b{padding:16px 18px;overflow-y:auto;flex:1}
.navhist{display:flex;gap:5px}
.navhist button{width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);font-size:14px;line-height:1;cursor:pointer;transition:background .12s,border-color .12s,color .12s,opacity .12s}
.navhist button:hover:not(:disabled){background:var(--sky-50);color:var(--deep)}
.navhist button:disabled{opacity:.28;cursor:default}
.nav{padding:10px 10px;flex:1;overflow:auto}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:#7fb8b7;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#d3e7e6;font-weight:500;font-size:13.5px;margin:1px 0;cursor:pointer;transition:background .12s,color .12s;border:1px solid transparent}
.nav a .ic{width:18px;display:inline-flex;align-items:center;justify-content:center;opacity:.92}
.icx{flex:0 0 auto;vertical-align:-2px}
button .icx,a .icx,.linkish .icx{vertical-align:-2px;margin-right:1px}
.nav a:hover{background:rgba(141,210,209,.14);color:#fff}
.nav a.on{background:rgba(141,210,209,.20);color:#fff;border-color:rgba(141,210,209,.42)}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px;min-width:18px;text-align:center}
.nav a.on .badge,.nav a:hover .badge{}
.side .who{border-top:1px solid rgba(255,255,255,.08);padding:11px 13px;display:flex;align-items:center;gap:9px;font-size:12.5px}
.side .who .av{flex:0 0 auto}
.side .who .meta{min-width:0}
.side .who .meta b{color:#fff;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .who .meta span{color:#8fc7c6;font-size:11px}
.side .who button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);color:#bcd9d8;border-radius:7px;padding:4px 8px;font-size:11px}
.side .who button:hover{background:rgba(255,255,255,.08)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:52px;z-index:30;background:#ffffff;border-bottom:1px solid var(--line);padding:11px 32px 12px;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.top-row{display:flex;align-items:center;gap:16px}
.top h1{font-size:21px;margin:0;letter-spacing:-.4px;font-weight:700;color:var(--ink)}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .sync{margin-left:auto;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sync .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--ink-soft);font-weight:500}
.content{padding:20px 32px 90px;max-width:none;width:100%}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line-strong);color:var(--ink-soft);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;transition:.12s}
.btn:hover{background:var(--sky-50);border-color:var(--sky-300)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#001628;box-shadow:0 1px 2px rgba(0,22,40,.18)}
.btn.primary:hover{background:var(--accent-700);border-color:var(--accent-700)}
.btn.secondary{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 1px 2px rgba(0,22,40,.2)}
.btn.secondary:hover{background:#062f4c;border-color:#062f4c}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--sky-100)}
.btn.danger{color:var(--red);border-color:#eccaca}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:7px 9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Cards / panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row{display:flex;gap:16px}
.grid{display:grid;gap:16px}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin:0 0 10px}

/* ---------- Pills / chips ---------- */
.pill-s{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:650;white-space:nowrap;border:1px solid transparent}
.s-green,.s-amber,.s-red,.s-grey,.s-blue,.s-navy{background:#f2f6fa;color:var(--ink-soft);border-color:var(--line-strong)}
.pill-s.s-green::before,.pill-s.s-amber::before,.pill-s.s-red::before{content:'';width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.pill-s.s-green::before{background:var(--green)}
.pill-s.s-amber::before{background:var(--amber)}
.pill-s.s-red::before{background:var(--red)}
.pill-s.has-dot::before{display:none}
.flagpill{white-space:normal;align-items:flex-start;line-height:1.4;max-width:100%}
.stamp-done{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);color:#137a50;background:#f2f6fa;border-radius:6px;padding:2px 9px;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.stamp-done.abd{border-color:var(--grey);color:#54697d;background:var(--grey-bg)}
.proj-done{opacity:.72}
.proj-active{border:2px solid transparent;border-radius:14px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ffd23f,#f5c518,#fff0b3,#f5c518,#ffd23f) border-box;box-shadow:0 6px 22px rgba(245,197,24,.16);animation:activeGlow 3.2s ease-in-out infinite}
@keyframes activeGlow{0%,100%{box-shadow:0 0 0 1px rgba(245,197,24,.30),0 4px 16px rgba(245,197,24,.14)}50%{box-shadow:0 0 0 2px rgba(245,197,24,.48),0 10px 30px rgba(245,197,24,.26)}}
.bolt{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:11px;color:#8a6d00;background:linear-gradient(120deg,#ffe680,#ffd23f);border:1px solid #eabf1a;border-radius:999px;padding:2px 9px;letter-spacing:.3px;text-transform:uppercase;box-shadow:0 1px 4px rgba(245,197,24,.35)}
.bolt.stretch{color:#0b514f;background:linear-gradient(120deg,#c8eeed,#8dd2d1);border-color:#6fc5c3;box-shadow:0 1px 4px rgba(141,210,209,.4)}
.proj-stretch{border:2px solid var(--accent);border-radius:14px}
tr.proj-stretch-tr td{background:rgba(141,210,209,.09)}
tr.proj-stretch-tr:hover td{background:rgba(141,210,209,.16)}
tr.proj-active-tr td{background:rgba(245,197,24,.055)}
tr.proj-active-tr:hover td{background:rgba(245,197,24,.10)}
.card.proj-active{animation:activeGlow 3.2s ease-in-out infinite}
.bolt .z{animation:boltFlash 1.8s steps(1) infinite}
@keyframes boltFlash{0%,70%,100%{opacity:1}80%,90%{opacity:.35}}
.eichip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--deep)}
.eichip b{color:var(--accent-700);font-size:11.5px}
.act-tasks{margin-top:10px;border-top:1px dashed #e6d489;padding-top:8px}
.act-trow{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:12.5px;cursor:pointer;border-radius:6px}
.act-trow:hover{background:#fffdf3}
.hdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.pill-s.click{cursor:pointer;transition:box-shadow .12s,filter .12s}
.pill-s.click:hover{box-shadow:0 0 0 2px rgba(0,22,40,.12);filter:saturate(1.1)}

/* ---------- Disclosure (collapsible) ---------- */
.disc{border-top:1px solid var(--line)}
.disc-head{display:flex;align-items:center;gap:9px;padding:13px 2px;cursor:pointer;user-select:none}
.disc-head:hover .disc-title{color:var(--navy)}
.disc-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;transition:color .12s}
.disc-count{font-size:11px;font-weight:700;color:var(--navy);background:var(--sky-100);border:1px solid var(--sky-200);border-radius:20px;padding:1px 8px}
.disc-chev{margin-left:auto;color:var(--muted-2);font-size:12px;transition:transform .18s ease}
.disc-chev.open{transform:rotate(90deg)}
.disc-body{padding:2px 2px 14px}

/* ---------- Target label ---------- */
.target{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.okr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px;align-content:start}
.okr-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.okr-hd-l{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.okr-hd-r{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.okr-hlab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);white-space:nowrap}
.okr-title{display:block;width:100%;font-weight:800;font-size:20px;line-height:1.28;letter-spacing:-.4px;text-wrap:balance}
.okr-title-sm{display:block;width:100%;font-weight:800;font-size:19px;line-height:1.28;letter-spacing:-.3px;color:var(--deep);text-wrap:balance}
.okr-grid>.card{display:flex;flex-direction:column}
.okr-drag{cursor:grab}
.okr-drag:active{cursor:grabbing}
.okr-drag.dragging{opacity:.45}
.okr-drag.drag-over{outline:2px dashed var(--accent-700);outline-offset:4px;border-radius:18px}
.okr-drag>.card{height:100%}
@media(max-width:980px){.okr-grid{grid-template-columns:1fr}}
.wl-h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted-2);font-weight:700;margin:0 0 3px 8px}
.wl-row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.wl-row:hover{background:var(--sky-50)}
.wl-row b{font-weight:800;color:var(--ink)}
.wl-row .lab{color:var(--ink-soft)}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
.wrow:first-child{border-top:none}
.wrow:hover{background:var(--sky-50)}
.wrow-x{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.wrow-main{flex:1;min-width:0}
.wrow-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--deep)}
.wrow-main:hover .wrow-t{text-decoration:underline;text-decoration-color:var(--accent-700);text-decoration-thickness:1.5px;text-underline-offset:3px}
.wrow-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.wcell-date{flex:0 0 auto;min-width:48px;text-align:right;white-space:nowrap}
.wcell-status{flex:0 0 auto;min-width:96px;display:flex;justify-content:flex-start;align-items:center}
.cbox{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line-strong);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;font-weight:900;background:var(--panel);transition:border-color .12s,color .12s}
.cbox:hover{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.date-edit{cursor:pointer;border-bottom:1px dashed transparent;border-radius:3px;padding:0 2px}
.date-edit:hover{border-bottom-color:var(--muted-2);background:var(--sky-50)}
.ctray-wrap{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,22,40,.32);padding:20px;animation:ctrayFade .14s ease}
@keyframes ctrayFade{from{opacity:0}to{opacity:1}}
.ctray{width:520px;max-width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;box-shadow:0 30px 70px rgba(0,22,40,.34);padding:24px 26px;animation:ctrayIn .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ctrayIn{from{transform:scale(.94) translateY(8px);opacity:.3}to{transform:scale(1) translateY(0);opacity:1}}
.ctray-puppy{font-size:26px;line-height:1;display:inline-block;animation:puppyBounce 1.1s ease-in-out infinite;transform-origin:center bottom}
@keyframes puppyBounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
.cmt{border-top:1px solid var(--line);padding:9px 0}
.cmt:first-child{border-top:none}
.cmt-h{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:3px}
.cmt-b{font-size:13.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.mention{color:var(--deep);background:var(--accent-bg);border-radius:4px;padding:0 3px;font-weight:700}
.cmt-thread{padding:10px 0;border-bottom:1px solid var(--line)}
.cmt-thread:last-of-type{border-bottom:none}
.cmt-replies{margin-left:14px;padding-left:12px;border-left:2px solid var(--line);margin-top:2px}
.cmt-foot{display:flex;gap:14px;align-items:center;margin-top:4px;padding-left:1px}
.cmt-resolved{opacity:.6}
.mention-menu{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lg);z-index:50;max-height:210px;overflow:auto;padding:4px}
.mention-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.mention-opt:hover{background:var(--accent-bg)}
.inbox-card{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;background:var(--panel)}
.inbox-card:hover{border-color:var(--accent);background:var(--panel-2)}
.inbox-card.unread{background:#f4fbfa;border-color:var(--accent)}
.okr-halo{border-color:rgba(141,210,209,.55)!important;box-shadow:0 0 0 1px rgba(141,210,209,.40), 0 2px 6px rgba(0,22,40,.05), 0 12px 36px rgba(141,210,209,.20)}
.okr-halo:hover{box-shadow:0 0 0 1px rgba(141,210,209,.60), 0 2px 8px rgba(0,22,40,.06), 0 16px 44px rgba(141,210,209,.28)}
.rs{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--panel)}
.rs-h{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--panel);cursor:pointer;user-select:none}
.rs-h:hover{background:var(--sky-50)}
.rs-chev{color:var(--muted-2);font-size:11px;display:inline-block;transition:transform .15s ease;flex:0 0 auto}
.rs-chev.open{transform:rotate(90deg)}
.mine-lbl{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-weight:800;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink)}
.mine-lbl:after{content:"";flex:1;height:1px;background:var(--line)}
.rs-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.rs-t{font-weight:750;font-size:15px;flex:1;color:var(--ink);letter-spacing:-.2px}
.rs-c{font-size:11px;font-weight:800;color:var(--muted);background:var(--ghost,#f2f6fa);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.rs-body{padding:2px 16px 4px;border-top:1px solid var(--line)}
.rs-empty{padding:11px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
/* My Work - Active now hero (gold = the active state) */
.now{border:1px solid #f0d98c;border-radius:14px;background:linear-gradient(180deg,#fffdf2 0%,#ffffff 70px);box-shadow:0 0 0 1px rgba(245,197,24,.12), 0 10px 30px rgba(245,197,24,.10);padding:16px 20px 8px;margin-bottom:20px}
.now-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.now-title{font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;color:var(--deep)}
.now-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}
@media(max-width:980px){.now-grid{grid-template-columns:1fr}}
.now-col-h{font-size:11.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding:6px 0 5px;border-bottom:1px solid #eee3bd;display:flex;align-items:center;gap:7px}
.now-empty{padding:12px 2px;color:var(--muted);font-size:12.5px}
.target .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted-2);font-weight:700}
.target .val{font-size:13.5px;font-weight:800;color:var(--navy);letter-spacing:-.1px}

/* ---------- Global search ---------- */
.search-wrap{position:relative;width:100%;max-width:none;min-width:0}
.search-inp{width:100%;border:1px solid var(--line-strong);border-radius:11px;padding:11px 14px 11px 40px;background:var(--panel);color:var(--ink);outline:none;font-size:14.5px;transition:.12s}
.search-inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(141,210,209,.35)}
.search-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:15px;pointer-events:none;opacity:.7}
.search-pop{position:absolute;top:calc(100% + 8px);left:0;width:min(720px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-lg);max-height:66vh;overflow-y:auto;overflow-x:hidden;z-index:60;padding:8px}
.search-grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted-2);font-weight:700;padding:10px 12px 5px}
.search-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer}
.search-item:hover{background:var(--sky-50)}
.search-item .si-t{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item .si-k{flex:0 0 auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2)}
.search-empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- Avatars ---------- */
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;letter-spacing:.2px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.av.lg{width:34px;height:34px;font-size:13px}
.av.md{width:30px;height:30px;font-size:12px}
.av.xl{width:58px;height:58px;font-size:20px;border-radius:50%}
.av.sm{width:21px;height:21px;font-size:9.5px}
.av-stack{display:inline-flex}
.av-stack .av{margin-left:-7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 0 2px var(--panel)}
.av-stack .av:first-child{margin-left:0}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--sky-50)}
.tbl .title-cell{font-weight:650;color:var(--ink)}
.tbl .title-cell small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.tbl tbody td{vertical-align:middle}
tr.proj-active-tr td{padding-top:14px;padding-bottom:14px}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:650;color:var(--ink-soft);margin-bottom:5px}
.fhint{display:inline-flex;margin-left:6px;color:var(--muted-2);vertical-align:-2px;cursor:help}
.align-sub{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.sc-row{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;font-size:12.5px;line-height:1.4;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.sc-row:hover{border-color:var(--accent)}
.sc-row.on{background:var(--accent-bg);border-color:var(--accent)}
.sc-row input{display:none}
.sc-row .sc-tick{flex:0 0 auto;margin-top:2px;color:var(--line-strong)}
.sc-row.on .sc-tick{color:var(--accent-700)}
.fhint:hover{color:var(--accent-700)}
.fhint[data-tip]:hover::after{white-space:normal;width:max-content;max-width:230px;text-align:left;line-height:1.45;font-weight:500}
.hhint{margin-left:9px;vertical-align:2px}
.hhint[data-tip]:hover::after{left:0;transform:none;max-width:340px}
/* activity log */
.act-day{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.act-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:none}
.act-chg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.act-pair{font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.act-pair .k{font-weight:700;margin-right:5px;color:var(--ink)}
.act-note{font-size:12px;color:var(--muted);font-style:italic}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:var(--panel);color:var(--ink);transition:.12s;outline:none}
.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(141,210,209,.30)}
textarea.inp{resize:vertical;min-height:62px;line-height:1.5}
.inp::placeholder{color:#a8bccf}
.f-row{display:flex;gap:12px}
.f-row>*{flex:1}
.chk-grid{display:flex;flex-wrap:wrap;gap:7px}
/* measurable success criteria */
.sc-line{padding:7px 0;border-top:1px dashed var(--line)}
.sc-line:first-child{border-top:none}
.sc-line-top{display:flex;align-items:flex-start;gap:9px}
.sc-flag{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:0 0 auto;margin-top:6px}
.sc-flag.warn{background:var(--amber)}
.sc-text{flex:1;min-width:0;font-size:13.5px;color:var(--ink-soft);line-height:1.55}

/* linked-objective chip (solid navy) vs success-criteria chip (seafoam) - instantly distinguishable */
.chip-obj{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--deep);color:#fff;border:1px solid var(--deep);cursor:pointer}
.chip-obj:hover{background:#0a2e4d}
.chip-obj .n{color:var(--sky);font-weight:800}
.chip-sc{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sky-100);border:1px solid var(--sky);color:var(--navy-700)}
.chip-sc .icx{color:var(--accent-700);flex:0 0 auto}
/* searchable select (people / projects) */
.ssel{position:relative;display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);padding:5px 32px 5px 7px;cursor:text;min-height:38px}
.ssel:focus-within{border-color:var(--accent-700);box-shadow:0 0 0 3px var(--accent-bg)}
.ssel-in{border:none;outline:none;flex:1;min-width:70px;font:inherit;font-size:13px;padding:3px 2px;background:transparent;color:var(--ink)}
.ssel-chip{display:inline-flex;align-items:center;gap:6px;background:var(--sky-100);border:1px solid var(--sky);color:var(--navy-700);border-radius:16px;padding:2px 7px 2px 3px;font-size:12.5px;font-weight:600;max-width:100%}
.ssel-chip .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 2px;line-height:1}
.ssel-chip .x:hover{color:var(--red)}
.ssel-car{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none;display:inline-flex}
.ssel-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lg);z-index:40;max-height:236px;overflow:auto;padding:4px}
.ssel-menu.up{top:auto;bottom:calc(100% + 5px)}
.ssel-opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.ssel-opt.hi{background:var(--sky-50)}
.ssel-opt.on{background:var(--sky-100)}
.ssel-opt .sub{margin-left:auto;font-size:11px;color:var(--muted);flex:0 0 auto;padding-left:8px}
.ssel-tick{color:var(--accent-700);width:16px;display:inline-flex;justify-content:center;flex:0 0 auto}
.chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:20px;padding:5px 11px 5px 9px;font-size:12.5px;cursor:pointer;background:var(--panel);user-select:none;font-weight:550;color:var(--ink-soft)}
.chk:hover{border-color:var(--sky-300);background:var(--sky-50)}
.chk.on{background:var(--sky-100);border-color:var(--sky);color:var(--navy-700)}
.chk input{display:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:transparent;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}

/* ---------- Modal / Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,36,61,.42);backdrop-filter:blur(2px);z-index:90;display:flex;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{margin:auto;background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(560px,94vw);max-height:90vh;overflow:auto;animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
.modal .mh{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px;letter-spacing:-.2px}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--panel-2);border-radius:0 0 var(--r-lg) var(--r-lg);position:sticky;bottom:0}
.x{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--sky-100);color:var(--ink)}

.drawer-scrim{position:fixed;inset:0;background:rgba(15,36,61,.34);z-index:80;animation:fade .14s ease}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(840px,96vw);background:var(--panel);box-shadow:var(--shadow-lg);z-index:85;display:flex;flex-direction:column;animation:slide .2s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.drawer .dh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer .db{padding:20px 22px;overflow:auto;flex:1}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.crumb a{cursor:pointer;color:var(--ink-soft);font-weight:600}
.crumb a:hover{text-decoration:underline;color:var(--ink)}
.backlink{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#fff;background:var(--deep);border:1px solid var(--deep);border-radius:8px;padding:4px 10px 4px 8px;cursor:pointer;transition:background .12s,border-color .12s,color .12s;margin-bottom:7px;max-width:100%}
.backlink:hover{background:#062f4c;border-color:#062f4c;color:#fff}
.backlink .arr{font-size:14px;line-height:1;margin-top:-1px}
.backlink .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Misc layout helpers ---------- */
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;align-items:start;font-size:13px}
.kv .k{color:var(--muted);font-weight:600;font-size:12px;padding-top:2px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-size:26px;font-weight:780;letter-spacing:-.6px;line-height:1}
.hc-n{display:inline-block;color:var(--deep)}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:7px}
.bar{height:7px;border-radius:6px;background:var(--sky-100);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--deep)}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}
.tag-due{font-weight:650}
.tag-due.over{color:var(--red)}
.tag-due.soon{color:var(--amber)}
.flag{display:inline-flex;align-items:center;gap:7px;background:#f2f6fa;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600}
.flag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto}
.note{background:var(--sky-50);border:1px solid var(--sky-200);padding:10px 13px;border-radius:10px;font-size:13px}
.linkish{cursor:pointer;color:var(--deep);font-weight:600;text-decoration:none}
.linkish:hover{text-decoration:underline;text-decoration-color:var(--accent-700);text-decoration-thickness:1.5px;text-underline-offset:2px}
.tlink{color:var(--deep);cursor:pointer;text-decoration:none}
.tlink:hover{text-decoration:underline;text-decoration-color:var(--accent-700);text-decoration-thickness:1.5px;text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--deep)}
.hl{background:linear-gradient(180deg,transparent 60%,#fff2c4 60%)}
.divider{height:1px;background:var(--line);margin:18px 0}
.banner{background:#fff7e6;border:1px solid #f3e2bb;color:#8a6516;border-radius:8px;padding:7px 12px;font-size:12.5px;display:flex;align-items:center;gap:9px}
.banner.info{background:var(--sky-50);border-color:var(--sky-200);color:var(--deep)}

/* next steps */
.ns{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ns:last-child{border-bottom:none}
.ns .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:12px;background:var(--panel)}
.ns .box.done{background:var(--green);border-color:var(--green)}
.ns .body{flex:1;min-width:0}
.ns .body .t{font-weight:550}
.ns .body.done .t{text-decoration:line-through;color:var(--muted)}
.ns .meta-line{font-size:11px;color:var(--muted-2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}

/* setup screen */
.setup-wrap{max-width:720px;margin:40px auto;padding:0 20px}
.steps{counter-reset:s}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step .num{counter-increment:s;flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.step .num::before{content:counter(s)}
.step h4{margin:2px 0 4px;font-size:14px}
.code{background:#001628;color:#d3e7e6;border-radius:8px;padding:11px 13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:auto;white-space:pre;margin:8px 0}

@media (max-width:860px){
  .topbar{padding:0 10px;gap:8px}
  .navhist{display:none}
  .tb-tab{padding:6px 9px}
  .tb-right .pill .tb-lbl{display:none}
  .content{padding:16px 14px 90px}
  .top{padding:12px 14px}
  .f-row{flex-direction:column}
}
.menu-btn{display:none;border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:7px 10px}
.side-scrim{display:none}
.side-close{display:none;position:absolute;top:10px;right:10px;z-index:2;width:28px;height:28px;align-items:center;justify-content:center;border:none;border-radius:8px;background:rgba(255,255,255,.08);color:#dbe9e8;font-size:17px;line-height:1;cursor:pointer}
.side-close:hover{background:rgba(255,255,255,.16)}
/* ---------- WBR ---------- */
.wbr-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.wbr-sel{border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:700;padding:7px 10px;outline:none;cursor:pointer}
.wbr-sel:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(141,210,209,.30)}
.wbr-seg button{padding:7px 13px}
.wbr-bd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.wbr-bd b{color:var(--ink);font-weight:750;font-variant-numeric:tabular-nums}
.wbr-bd-pct{background:#f2f6fa;border:1px solid var(--line);border-radius:20px;padding:1px 8px;
  font-size:11px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wbr-cad{display:inline-block;background:#f2f6fa;border:1px solid var(--line);border-radius:20px;
  padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--muted);
  text-transform:uppercase;white-space:nowrap;cursor:help}

.wbr-tbl td{padding:7px 10px}
.wbr-tbl th{padding:8px 10px;white-space:nowrap}
.wbr-noown{width:22px;height:22px;border-radius:50%;border:1px dashed var(--line-strong);
  flex:0 0 auto;display:inline-block;cursor:help}
.wbr-nopace{color:var(--muted-2);cursor:help}
/* tooltips on the first column sit half outside a clipping scroll box when centred */
.tip-l[data-tip]:hover::after{left:0;transform:none}
.tip-r[data-tip]:hover::after{left:auto;right:0;transform:none}
/* scroll wrappers clip on both axes, so leave room for a bottom-row tooltip */
.wbr-scroll{overflow-x:auto;padding-bottom:30px;margin-bottom:-26px}

.wbr-goalwrap{display:flex;align-items:center;gap:6px;justify-content:flex-end;width:100%}
.wbr-goalwrap .wbr-goal{width:auto;min-width:54px;flex:0 1 auto}
.wbr-srcchip{flex:0 0 auto;border-radius:20px;padding:1px 6px;font-size:9px;font-weight:800;
  letter-spacing:.5px;border:1px solid transparent;background:transparent;color:var(--muted-2);cursor:help}
.wbr-srcchip.plan{border-color:var(--line-strong);background:#f2f6fa;color:var(--ink-soft)}
.wbr-srcchip.pin{border-color:var(--line-strong);border-style:dashed;color:var(--ink-soft)}
.wbr-srcchip.click{cursor:pointer}
.wbr-srcchip.click:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--deep)}

.wbr-plan-cell{background:none;border:1px dashed transparent;border-radius:6px;padding:4px 8px;width:100%;
  text-align:right;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;cursor:text}
.wbr-plan-cell:hover{border-color:var(--line-strong);background:var(--sky-50)}
.wbr-plan-cell.empty{color:var(--muted-2);font-weight:500}
.wbr-mcol{position:sticky;left:0;background:var(--panel);z-index:2;box-shadow:1px 0 0 var(--line)}
.wbr-tbl tbody tr:hover .wbr-mcol{background:var(--sky-50)}
.wbr-eye{background:none;border:none;padding:2px 4px;border-radius:6px;color:var(--muted-2);cursor:pointer;display:inline-flex}
.wbr-eye:hover{background:var(--sky-100);color:var(--deep)}
.wbr-eye.off{color:var(--muted-2);opacity:.55}
.wbr-goalpanel{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-strong);
  border-radius:10px;overflow:hidden;margin-bottom:6px}
.wbr-goalbox{padding:12px 14px}
.wbr-goalbox + .wbr-goalbox{border-left:1px solid var(--line)}
.wbr-goalbox.on{background:var(--accent-bg)}
.wbr-goalbox .lbl{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wbr-goalbox .big{font-size:22px;font-weight:780;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.wbr-tbl.norow tbody tr{cursor:default}
.wbr-tbl .r,.tbl th.r,.tbl td.r{text-align:right}
.wbr-namec{font-weight:650}
.wbr-name{display:flex;align-items:center;gap:7px;min-width:0;font-weight:650}
.wbr-name .tlink{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbr-src{color:var(--muted-2);display:inline-flex;flex:0 0 auto}
.wbr-src:hover{color:var(--accent-700)}
.wbr-own{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}

.wbr-val{background:none;border:1px dashed transparent;border-radius:6px;padding:4px 8px;width:100%;
  text-align:right;font:inherit;font-size:13.5px;font-weight:750;color:var(--ink);
  font-variant-numeric:tabular-nums;cursor:text}
.wbr-val:hover{border-color:var(--line-strong);background:var(--sky-50)}
.wbr-val.empty{color:var(--muted-2);font-weight:500;border-color:var(--line)}
.wbr-goal{background:none;border:1px dashed transparent;border-radius:6px;padding:4px 8px;width:100%;
  text-align:right;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;cursor:pointer}
.wbr-goal:hover{border-color:var(--line-strong);background:var(--sky-50)}
.wbr-goal.inh{font-weight:500;color:var(--muted)}

/* ---------------- helpers ---------------- */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

function fmtDate(d){
  if(!d) return '';

  if(isNaN(dt)) return '';

function fmtDateShort(d){
  if(!d) return '';

  if(!d) return null;

function isOverdue(d, status){ if(status==='done'||status==='abandoned'||!d) return false; const n=daysFromNow(d); return n!==null && n<0; }
function isStale(lastActivity, status){ if(status==='done'||status==='abandoned') return false; if(!lastActivity) return true; const diff=Date.now()-new Date(lastActivity).getTime(); return diff > STALE_DAYS*86400000; }

/* parse a timeframe string into a window - tolerant of how people actually write dates:
   "2026", "2026 H1", "Q3 2026", "Aug 2026", "Dec 31", "December 31st - 2026", "2026-2028", "12/31/2026" */
function parseTimeframe(tf, createdAt){
  let s=String(tf||'').trim().toLowerCase(); if(!s) return null;
  s=s.replace(/,/g,' ').replace(/(\d+)(st|nd|rd|th)\b/g,'$1').replace(/\s*[-\u2013\u2014]\s*/g,' - ').replace(/\s+/g,' ').trim();
  const MO='jan feb mar apr may jun jul aug sep oct nov dec'.split(' ');
  const mi=(w)=>MO.indexOf(String(w).slice(0,3));
  let m=s.match(/^(\d{4}) - (\d{4})$/); if(m) return {a:new Date(+m[1],0,1), b:new Date(+m[2],11,31)};
  m=s.match(/^(?:(\d{4}) )?h([12])(?: (\d{4}))?$/); if(m&&(m[1]||m[3])){ const y=+(m[1]||m[3]); return m[2]==='1'?{a:new Date(y,0,1),b:new Date(y,5,30)}:{a:new Date(y,6,1),b:new Date(y,11,31)}; }
  m=s.match(/^(?:(\d{4}) )?q([1-4])(?: (\d{4}))?$/); if(m&&(m[1]||m[3])){ const y=+(m[1]||m[3]), q=+m[2]; return {a:new Date(y,(q-1)*3,1), b:new Date(y,q*3,0)}; }
  m=s.match(/^(\d{4})$/); if(m) return {a:new Date(+m[1],0,1), b:new Date(+m[1],11,31)};
  // end-date forms - pace runs from the objective's creation (or Jan 1 of the target year)
  const t=s.replace(/ - /g,' ');
  let end=null;
  m=t.match(/^([a-z]{3,9}) (\d{1,2}) (\d{4})$/); if(m&&mi(m[1])>=0) end=new Date(+m[3],mi(m[1]),+m[2]);
  if(!end){ m=t.match(/^(\d{1,2}) ([a-z]{3,9}) (\d{4})$/); if(m&&mi(m[2])>=0) end=new Date(+m[3],mi(m[2]),+m[1]); }
  if(!end){ m=t.match(/^([a-z]{3,9}) (\d{4})$/); if(m&&mi(m[1])>=0) end=new Date(+m[2],mi(m[1])+1,0); }
  if(!end){ m=t.match(/^([a-z]{3,9}) (\d{1,2})$/); if(m&&mi(m[1])>=0) end=new Date(new Date().getFullYear(),mi(m[1]),+m[2]); }
  if(!end){ m=t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/); if(m) end=new Date(+m[3],+m[1]-1,+m[2]); }

function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  const out=new Set(); const txt=String(text||'');
  (people||[]).forEach(p=>{

   access survives Kev leaving MoeGo and losing the work account. Owners can never be
   locked out of their own workspace, so the block list can never remove one. */
const OWNER_EMAILS=['kev.dazkevich@moego.pet','kdazkevich@gmail.com'];
function isOwnerEmail(e){ return OWNER_EMAILS.indexOf(String(e||'').trim().toLowerCase())>-1; }
function gradeFor(pid, projects, tasks, events, resetAt){
  const myP=projects.filter(p=>p.ownerId===pid);
  const myT=tasks.filter(t=>(t.ownerIds||[]).includes(pid));
  const items=[...myP,...myT];
  if(items.length===0) return {grade:'\u2014',na:true,total:0,overdue:0,hygiene:0,late:0,pushCount:0,pushDays:0,activeItems:0,items:0};
  const activeItems=items.filter(x=>!isClosedStatus(x.status));
  const activeTasks=myT.filter(t=>!isClosedStatus(t.status));
  const resetMs = resetAt ? new Date(resetAt).getTime() : 0;
  const STALE_MS = 7*86400000;
  // Overdue forgives anything already due on/before the reset; only new misses (due after reset) count.
  const overdue=activeItems.filter(x=> isOverdue(x.dueDate,x.status) && (!resetMs || new Date(((x.dueDate||'1970-01-01'))+'T00:00:00').getTime() >= resetMs)).length;
  // Staleness clock restarts at the reset; no-next-step gets a grace window after a reset.
  const hygiene=activeTasks.filter(t=>{
    const la=new Date(t.lastActivity||t.createdAt||0).getTime();
    return (Date.now()-Math.max(la,resetMs))>STALE_MS;
  }).length;
  const cutoff=Date.now()-90*86400000;
  const floor=resetAt? Math.max(cutoff, resetMs) : cutoff;
  const ids=new Set(items.map(x=>x.id));
  const evs=(events||[]).filter(e=>ids.has(e.entityId) && new Date(e.ts).getTime()>=floor);
  const pushes=evs.filter(e=>e.type==='date_change' && e.meta && e.meta.dir==='push');
  const pushCount=pushes.length;
  const pushDays=pushes.reduce((a,e)=>a+((e.meta&&e.meta.days)||0),0);
  const late=evs.filter(e=>e.type==='completed' && e.meta && e.meta.onTime===false).length;
  const honest=overdue*2 + hygiene*1 + late*1.5;
  const forgiveness=1.5 + Math.min(2, 0.3*activeItems.length);
  const integrity=pushCount*2 + Math.floor(pushDays/14)*1;
  const total=Math.max(0, honest-forgiveness)+integrity;
  const grade= total<1?'A': total<3?'B': total<5?'C': total<7.5?'D':'F';
  return {grade,na:false,total:Math.round(total*10)/10,overdue,hygiene,late,pushCount,pushDays,activeItems:activeItems.length,items:items.length};
}
function gradeMeta(letter){
  return ({A:{color:'#11936a'},B:{color:'#3a9d57'},C:{color:'#c2820f'},D:{color:'#d2761a'},F:{color:'#e9072b'}})[letter]||{color:'#7e96a6'};
}
function GradeBadge({letter,size}){
  const m=gradeMeta(letter); const S=size||46;
  return React.createElement('div',{style:{width:S,height:S,borderRadius:'50%',flex:'0 0 auto',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:Math.round(S*0.44),color:'#fff',background:m.color,boxShadow:'inset 0 0 0 1px rgba(255,255,255,.3), 0 2px 6px rgba(0,22,40,.18)'}}, letter);
}

function resizeImageFile(file, cb){
  if(!file){ cb(''); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S=176, c=document.createElement('canvas'); c.width=S; c.height=S;
      const ctx=c.getContext('2d');
      const scale=Math.max(S/img.width, S/img.height);
      const w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(e){ cb(''); }
    };
    img.onerror=()=>cb('');
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   WBR - Weekly Business Review
   ------------------------------------------------------------
   The whole point of this module is that nobody types a pacing
   number or a percent-to-plan ever again. You type the actual.
   Everything else is derived from four properties on the metric:

     cad  - the window the number covers (MTD, QTD, T30, PIT, Forecast)
     agg  - cumulative (paces to a run rate) or a rate/average (never paced)
     dir  - higher is better, lower is better, or hit the target
     band - how far off plan still counts as a watch rather than a miss

   Pacing is business-day aware: a month-to-date number is divided by
   the share of the period's working days that have elapsed, holidays
   removed, so week 2 of a 21-day month projects off 11 days, not 17.
   ============================================================ */

  MTD:  {label:'MTD',      full:'Month to date',      paces:true,  scope:'month'},
  QTD:  {label:'QTD',      full:'Quarter to date',    paces:true,  scope:'quarter'},
  T7:   {label:'T7',       full:'Trailing 7 days',    paces:false, scope:'trailing', days:7},
  T14:  {label:'T14',      full:'Trailing 14 days',   paces:false, scope:'trailing', days:14},
  T30:  {label:'T30',      full:'Trailing 30 days',   paces:false, scope:'trailing', days:30},
  T60:  {label:'T60',      full:'Trailing 60 days',   paces:false, scope:'trailing', days:60},
  T90:  {label:'T90',      full:'Trailing 90 days',   paces:false, scope:'trailing', days:90},
  PIT:  {label:'Current',  full:'Point in time',      paces:false, scope:'pit'},
  FCST: {label:'Forecast', full:'Forecast',           paces:false, scope:'forecast'},

const WBR_CAD_ORDER = ['MTD','QTD','T7','T14','T30','T60','T90','PIT','FCST'];
const WBR_AGG = {
  cum:  {label:'Cumulative',      hint:'Builds up over the period, so a part-period number is projected to a full-period run rate.'},
  snap: {label:'Rate or average', hint:'Already a rate, average, or point-in-time reading, so it is never projected.'},

const WBR_DIR = {
  up:     {label:'Higher is better', short:'higher'},

const WBR_FMT = {

function wbrToday(){ return todayStr(); }

}

function wbrParseVal(raw){

  const set={};
  ((S&&S.holidays)||[]).forEach(h=>{ const d=String(h).slice(0,10); if(d>=start&&d<=end) set[d]=1; });
  (periods||[]).forEach(p=>{ (p.holidays||[]).forEach(h=>{ const d=String(h).slice(0,10); if(d>=start&&d<=end) set[d]=1; }); });
  return Object.keys(set).sort();
}
function wbrMakePeriod(pk, S){
  const b=wbrMonthBounds(pk);
  const hol=wbrHolidaysIn(S,b.start,b.end);
  return {id:pk, label:wbrMonthLabel(pk), scope:'month', start:b.start, end:b.end,
          weeks:wbrDefaultWeeks(b.start,b.end,hol,S.reviewDay), closed:false};
}
function wbrPeriodOf(periods, pk, S){
  const b=wbrMonthBounds(pk);
  const p=(periods||[]).find(x=>x.id===pk)||{};
  const start=p.start||b.start, end=p.end||b.end;
  const holidays=wbrHolidaysIn(S,start,end,[p]);
  return {
    id:pk, label:p.label||wbrMonthLabel(pk), scope:'month', start, end, holidays,
    weeks:(Array.isArray(p.weeks)&&p.weeks.length)?p.weeks:wbrDefaultWeeks(start,end,holidays,S.reviewDay),
    closed:!!p.closed,
  };
}
/* CAPTURE
   A checkpoint is "captured" once somebody says the week is finished. It is a marker,
   not a snapshot - readings stay live, so a correction to an input still flows through
   to anything worked out from it. What it buys is an honest history: a half-entered
   week never masquerades as a real data point on a trend line.
   This whole idea goes away the day the numbers come out of a CRM on their own. */
function wbrIsCaptured(week){ return !!(week && week.capturedAt); }
function wbrCapturedCount(period){ return (period.weeks||[]).filter(wbrIsCaptured).length; }
function wbrCurrentWeek(period){
  const t=wbrToday(), ws=period.weeks||[];
  if(!ws.length) return null;
  let pick=null;
  ws.forEach(w=>{ if(!w.final && String(w.date)<=t) pick=w; });
  if(!pick) pick = ws.find(w=>!w.final) || ws[0];
  if(String(period.end) < t) pick = ws[ws.length-1];
  return pick;
}

/* ---------- the pacing engine ---------- */
/* one context per cadence for the selected period + week */
function wbrCtx(cadKey, period, week, periods, S){
  const cad=WBR_CAD[cadKey]||WBR_CAD.MTD;
  if(!cad.paces) return {paces:false, frac:1, cad};
  let start=period.start, end=period.end, hol=(period.holidays||[]).slice();
  if(cad.scope==='quarter'){
    const q=wbrQuarterBounds(period.id);
    start=q.start; end=q.end;
    hol=wbrHolidaysIn(S,start,end,periods);
  }
  const asOfRaw=week? week.date : end;
  const asOf = asOfRaw<start? start : (asOfRaw>end? end : asOfRaw);
  const total=wbrBizDays(start,end,hol);
  const elapsed=wbrBizDays(start,asOf,hol);
  return {paces:true, frac: total? elapsed/total : 0, total, elapsed, start, end, asOf, cad};
}
function wbrCtxMap(period, week, periods, S){
  const m={};
  WBR_CAD_ORDER.forEach(k=>{ m[k]=wbrCtx(k,period,week,periods,S); });
  return m;
}
/* the projected full-period number. Rates and averages are never projected. */
function wbrPace(metric, value, ctx){
  if(value==null||isNaN(value)) return null;
  if(!ctx||!ctx.paces||metric.agg!=='cum') return value;
  if(!ctx.frac) return null;
  return value/ctx.frac;
}
function wbrPacesFor(metric, ctx){ return !!(ctx && ctx.paces && metric.agg==='cum' && ctx.frac>0 && ctx.frac<1); }
/* percent to plan, direction aware. 100% always means "hitting the goal". */
function wbrPctPlan(metric, pace, goal){
  if(goal==null||isNaN(goal)||pace==null||isNaN(pace)||!isFinite(pace)) return null;
  const d=metric.dir||'up';
  if(d==='up')   return goal===0? null : (pace/goal)*100;
  if(d==='down'){
    if(pace===0) return goal===0? 100 : 999;
    return (goal/pace)*100;
  }
  const a=Math.abs(pace), g=Math.abs(goal);
  if(!a && !g) return 100;
  const hi=Math.max(a,g);
  return hi? (Math.min(a,g)/hi)*100 : null;
}
/* good = meeting it, warn = inside the metric's tolerance band, bad = beyond it */
function wbrTone(metric, pace, goal){
  if(goal==null||isNaN(goal)||pace==null||isNaN(pace)||!isFinite(pace)) return null;
  const band=(metric.band!=null && !isNaN(metric.band))? Number(metric.band) : 10;
  const d=metric.dir||'up';
  if(d==='up')   return pace>=goal? 'good' : (goal>0 && pace>=goal*(1-band/100)? 'warn':'bad');
  if(d==='down') return pace<=goal? 'good' : (goal>0 && pace<=goal*(1+band/100)? 'warn':'bad');
  const diff = goal!==0? Math.abs(pace-goal)/Math.abs(goal)*100 : (pace===0?0:100);
  return diff<=band/2? 'good' : (diff<=band? 'warn':'bad');
}
/* ------------------------------------------------------------
   GOALS: every metric can carry two goals for a given month.

     plan[pk]   the finance model number, owned by the Plan tab
     goals[pk]  the manual number, owned by whoever runs the review
                (falls back to goalDefault when the month is blank)

   The plan wins whenever it exists. When the model has nothing for
   that metric the manual goal takes over on its own, and a metric can
   be pinned to manual for a month when the plan has run away from
   reality. Pacing never changes, only which number it is read against.
   ------------------------------------------------------------ */
function wbrNum(v){ return (v!=null && v!=='' && !isNaN(v))? Number(v) : null; }
function wbrPlanGoal(metric, pk){ return wbrNum((metric.plan||{})[pk]); }
function wbrManualGoal(metric, pk){
  const g=wbrNum((metric.goals||{})[pk]);
  return g!=null? g : wbrNum(metric.goalDefault);
}
function wbrGoalMode(metric, pk){ return (metric.goalModeBy||{})[pk] || metric.goalMode || 'auto'; }
function wbrGoalInfo(metric, pk, planOverride){
  const plan = planOverride!==undefined && planOverride!==null ? wbrNum(planOverride) : wbrPlanGoal(metric,pk);
  const manual=wbrManualGoal(metric,pk);
  const mode=wbrGoalMode(metric,pk);
  if(mode==='manual') return {goal:manual, src:manual!=null?'manual':'none', plan, manual, pinned:true};
  if(plan!=null)      return {goal:plan,   src:'plan',   plan, manual, pinned:false};
  return {goal:manual, src:manual!=null?'manual':'none', plan, manual, pinned:false};
}
function wbrGoal(metric, pk){ return wbrGoalInfo(metric,pk).goal; }
const WBR_SRC_LABEL={plan:'Plan', manual:'Manual', none:'No goal'};

/* ---- the annual model: months, quarters, and how a quarter rolls up ---- */
function wbrYearMonths(y){ const o=[]; for(let m=1;m<=12;m++) o.push(y+'-'+(m<10?'0':'')+m); return o; }
function wbrQuarterMonths(y,q){ return [1,2,3].map(i=>{ const m=q*3+i; return y+'-'+(m<10?'0':'')+m; }); }
/* cumulative metrics sum across the quarter, rates and balances take the closing month */
function wbrPlanQuarter(metric, y, q){
  const vals=wbrQuarterMonths(y,q).map(k=>wbrPlanGoal(metric,k));
  if(metric.agg==='cum'){
    const got=vals.filter(v=>v!=null);
    return got.length? got.reduce((a,b)=>a+b,0) : null;
  }
  for(let i=vals.length-1;i>=0;i--) if(vals[i]!=null) return vals[i];
  return null;
}
function wbrQLabel(y,q){ return 'Q'+(q+1)+' '+String(y).slice(2); }
/* a metric belongs to both surfaces unless it has been hidden from one */
function wbrInWbr(m){ return !m.archived && !m.hideWbr; }
function wbrInPlan(m){ return !m.archived && !m.hidePlan; }
/* the single call any other part of the product should use to read a metric.
   Projects and success criteria will hang off this once WBR feeds work health. */
function wbrRead(metric, entry, pk, ctx, goalOverride, planOverride){
  const info=wbrGoalInfo(metric,pk,planOverride);
  const useOverride = goalOverride!==undefined;
  const goal = useOverride? wbrNum(goalOverride) : info.goal;
  const value=(entry && entry.v!=null && !isNaN(entry.v))? Number(entry.v) : null;
  const pace=wbrPace(metric,value,ctx);
  const pct=wbrPctPlan(metric,pace,goal);
  const tone=wbrTone(metric,pace,goal);
  const status = value==null? 'blank' : (goal==null? 'nogoal' : (tone||'nogoal'));
  return {goal, value, pace, pct, tone, status, paced:wbrPacesFor(metric,ctx),
          raw:entry?entry.raw:'', note:entry?entry.note:'',
          goalSrc:useOverride?null:info.src, planGoal:info.plan, manualGoal:info.manual, pinned:info.pinned};
}

/* ---------- settings + store ---------- */
const WBR_DEFAULT_SECTIONS=[
  {id:'mktg',label:'Marketing',hcLeaderId:'mktg'},
  {id:'sales_in',label:'Sales - Inbound',hcLeaderId:'smbmm'},
  {id:'sales_out',label:'Sales - Outbound',hcLeaderId:'smbmm'},
  {id:'onboard',label:'Onboarding',hcLeaderId:'smbmm'},
  {id:'impl',label:'Implementation',hcLeaderId:'impl'},
  {id:'datamig',label:'Data Migration',hcLeaderId:'impl'},
  {id:'cs',label:'Customer Success',hcLeaderId:'cs'},
  {id:'support',label:'Support',hcLeaderId:'support'},
  {id:'enable',label:'Enablement',hcLeaderId:'enable'},
  {id:'company',label:'Company',hcLeaderId:''},
  {id:'finance',label:'Finance model',hcLeaderId:'',collapsed:true},
];
/* Sections a workspace was seeded before still need to appear, otherwise the view
   falls back to printing the raw id as a heading. Heals itself, no migration. */
function wbrMergeSections(stored){
  const out=(Array.isArray(stored)&&stored.length)? stored.slice() : WBR_DEFAULT_SECTIONS.slice();
  WBR_DEFAULT_SECTIONS.forEach(d=>{ if(!out.some(s=>s && s.id===d.id)) out.push(d); });
  return out;
}
/* built-in sections can ask to start closed. Finance is reference material during a
   review, not something anyone reads top to bottom, so it stays out of the way. */
const WBR_SEC_SHUT={}; WBR_DEFAULT_SECTIONS.forEach(s=>{ if(s.collapsed) WBR_SEC_SHUT[s.id]=1; });
function wbrSecDefaultOpen(sec){ return !(sec && (sec.collapsed || WBR_SEC_SHUT[sec.id])); }

function wbrEffSettings(ws){
  ws=ws||{};
  return {
    sections: wbrMergeSections(ws.sections),
    reviewDay: ws.reviewDay!=null? ws.reviewDay : 1,
    holidays: Array.isArray(ws.holidays)? ws.holidays : [],
    planYear: ws.planYear!=null? Number(ws.planYear) : new Date().getFullYear(),
    dashboard: Array.isArray(ws.dashboard)? ws.dashboard : [],
    dashboardSet: !!ws.dashboardSet,
    seeded: !!ws.seeded,
    planMigrated: !!ws.planMigrated,
  };
}
const WBR_ENTRY_ID=(mid,pk,wk)=> mid+'@'+pk+'_'+wk;
/* remembers the period and week you were on when you hop between WBR tabs */
const WBR_UI={pk:null, wk:null};

function useWbr(){
  const store=useStore();
  const st=store.state;
  const people=st.people||[];
  const S=useMemo(()=>wbrEffSettings(st.wbrSettings),[st.wbrSettings]);
  const metrics=useMemo(()=> (st.wbr_metrics||[]).slice().sort((a,b)=>(a.num||0)-(b.num||0)), [st.wbr_metrics]);
  const entries=st.wbr_entries||[];
  const periodsRaw=st.wbr_periods||[];
  const periods=useMemo(()=> periodsRaw.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id))), [periodsRaw]);
  const entryMap=useMemo(()=>{ const m={}; entries.forEach(e=>{ m[e.id]=e; }); return m; },[entries]);
  const metricMap=useMemo(()=>{ const m={}; metrics.forEach(x=>{ m[x.id]=x; }); return m; },[metrics]);
  const secMap=useMemo(()=>{ const m={}; S.sections.forEach(s=>{ m[s.id]=s; }); return m; },[S.sections]);

  /* every period key that has either a period record or any entry against it */
  const periodKeys=useMemo(()=>{
    const set={};
    periods.forEach(p=>{ set[p.id]=1; });
    entries.forEach(e=>{ if(e.pk) set[e.pk]=1; });
    if(!Object.keys(set).length) set[wbrMonthKey(wbrToday())]=1;
    return Object.keys(set).sort();
  },[periods,entries]);

  const actorEmailLc=String((store.user&&store.user.email)||'').toLowerCase();
  const actorPerson=actorEmailLc? people.find(p=>p.email&&String(p.email).toLowerCase()===actorEmailLc):null;
  const logAct=(action,entityId,entityName,changes)=> store.writeEntity('activity',{
    id:uid('ac'), ts:nowISO(), actorEmail:actorEmailLc||'',
    actorName: actorPerson? actorPerson.name : (actorEmailLc? actorEmailLc.split('@')[0] : 'Someone'),
    action, entityType:'metric', entityId:entityId||'', entityName:entityName||'', changes:changes||[]});

  const entryFor=useCallback((mid,pk,wk)=> entryMap[WBR_ENTRY_ID(mid,pk,wk)]||null, [entryMap]);
  const timeline=useMemo(()=>wbrTimeline(periodKeys,periods,S),[periodKeys,periods,S]);
  const resolver=useMemo(()=>wbrMakeResolver(metrics,entryMap,timeline),[metrics,entryMap,timeline]);
  /* the one call every view should use to read a metric at a checkpoint */
  const read=useCallback((m,pk,wk,ctx,goalOverride)=>
    wbrRead(m, resolver.entry(m,pk,wk), pk, ctx, goalOverride, resolver.plan(m.id,pk)), [resolver]);
  const planAt=useCallback((m,pk)=>resolver.plan(m.id,pk),[resolver]);
  const ownerOf=useCallback((m)=>{
    if(!m) return null;
    if(m.ownerId){ const p=people.find(x=>x.id===m.ownerId); if(p) return p; }
    if(m.ownerName){ const p=people.find(x=>String(x.name).toLowerCase()===String(m.ownerName).toLowerCase()); if(p) return p; }
    return null;
  },[people]);

  const MFIELDS=[['name','name'],['sec','section'],['cad','cadence'],['agg','aggregation'],['dir','direction'],
    ['fmt','format'],['band','tolerance'],['goalDefault','standing goal'],['ownerId','owner'],
    ['srcUrl','report link'],['srcNote','source'],['goalSrc','goal source'],['def','definition'],['archived','archived']];
  const mFmt=(k,v)=>{
    if(v==null||v==='') return 'none';
    if(k==='sec') return (secMap[v]||{}).label||v;
    if(k==='cad') return (WBR_CAD[v]||{}).label||v;
    if(k==='agg') return (WBR_AGG[v]||{}).label||v;
    if(k==='dir') return (WBR_DIR[v]||{}).label||v;
    if(k==='fmt') return WBR_FMT[v]||v;
    if(k==='ownerId'){ const p=people.find(x=>x.id===v); return p?p.name:'Unassigned'; }
    if(k==='archived') return v?'Archived':'Active';
    if(k==='band') return v+'%';
    const s=String(v); return s.length>80? s.slice(0,77)+'\u2026' : s;
  };

  const A={
    writeMetric:(m)=>{
      const prev=metricMap[m.id];
      const out=m.id? m : Object.assign({},m,{id:uid('wm')});
      if(!out.num) out.num=(metrics.reduce((a,b)=>Math.max(a,b.num||0),0))+1;
      const changes=[];
      if(prev) MFIELDS.forEach(f=>{ const a=prev[f[0]], b=out[f[0]];
        if(JSON.stringify(a==null?'':a)!==JSON.stringify(b==null?'':b)) changes.push({k:f[1],from:mFmt(f[0],a),to:mFmt(f[0],b)}); });
      if(!prev || changes.length) logAct(prev?'updated':'created', out.id, out.name||'', changes);
      store.writeEntity('wbr_metrics', out);
      return out;
    },
    deleteMetric:(id)=>{
      const m=metricMap[id];
      entries.filter(e=>e.mid===id).forEach(e=>store.deleteEntity('wbr_entries', e.id));
      if(m) logAct('deleted', id, m.name||'');
      store.deleteEntity('wbr_metrics', id);
    },
    setEntry:(metric, pk, wk, patch)=>{
      const id=WBR_ENTRY_ID(metric.id,pk,wk);
      const prev=entryMap[id]||{id, mid:metric.id, pk, wk, v:null, raw:'', note:''};
      const next=Object.assign({}, prev, patch, {id, mid:metric.id, pk, wk, updatedAt:nowISO()});
      const vChanged=String(prev.v==null?'':prev.v)!==String(next.v==null?'':next.v);
      const nChanged=String(prev.note||'')!==String(next.note||'');
      if(!vChanged && !nChanged) return;
      const ch=[];
      if(vChanged) ch.push({k:wbrMonthShort(pk)+' '+wk.toUpperCase(),
        from:wbrFmtV(prev.v,metric.fmt,prev.raw), to:wbrFmtV(next.v,metric.fmt,next.raw)});
      if(nChanged) ch.push({k:'note', from:prev.note||'none', to:next.note||'none'});
      logAct('updated', metric.id, metric.name||'', ch);
      store.writeEntity('wbr_entries', next);
    },
    setEntriesBulk:(rows)=>{ // [{metric, pk, wk, v, raw}]
      const outs=[]; let n=0;
      rows.forEach(r=>{
        if(wbrIsComputed(r.metric)) return;   // worked out, never typed
        const id=WBR_ENTRY_ID(r.metric.id,r.pk,r.wk);
        const prev=entryMap[id]||{id, mid:r.metric.id, pk:r.pk, wk:r.wk, v:null, raw:'', note:''};
        if(String(prev.v==null?'':prev.v)===String(r.v==null?'':r.v)) return;
        outs.push({coll:'wbr_entries', obj:Object.assign({}, prev, {id, mid:r.metric.id, pk:r.pk, wk:r.wk, v:r.v, raw:r.raw||'', updatedAt:nowISO()})});
        n++;
      });
      if(outs.length){
        store.writeMany(outs);
        logAct('bulk','', n+' metric'+(n===1?'':'s'), [{k:'pasted', from:'', to:n+' value'+(n===1?'':'s')}]);
      }
      return n;
    },
    setGoalsBulk:(rows)=>{ // [{metric, pk, goal}]  pk null = standing goal
      const outs=[]; let n=0;
      rows.forEach(r=>{
        const m=metricMap[r.metric.id]||r.metric;
        let next;
        if(r.pk){ const g=Object.assign({},m.goals||{}); if(r.goal==null) delete g[r.pk]; else g[r.pk]=r.goal; next=Object.assign({},m,{goals:g}); }
        else next=Object.assign({},m,{goalDefault:r.goal});
        outs.push({coll:'wbr_metrics', obj:next}); n++;
      });
      if(outs.length){ store.writeMany(outs); logAct('bulk','', n+' metric'+(n===1?'':'s'), [{k:'goals set', from:'', to:String(n)}]); }
      return n;
    },
    setPlan:(metric, pk, v)=>{
      const p=Object.assign({},metric.plan||{});
      if(v==null) delete p[pk]; else p[pk]=v;
      const next=Object.assign({},metric,{plan:p});
      logAct('updated', metric.id, metric.name||'', [{k:'plan '+wbrMonthShort(pk), from:wbrFmtV(wbrPlanGoal(metric,pk),metric.fmt), to:wbrFmtV(v,metric.fmt)}]);
      store.writeEntity('wbr_metrics', next);
    },
    setPlanBulk:(rows)=>{ // [{metric, pk, v}] - grouped so one metric is written once
      const by={};
      rows.forEach(r=>{ const cur=by[r.metric.id]||Object.assign({},(metricMap[r.metric.id]||r.metric).plan||{});
        if(r.v==null) delete cur[r.pk]; else cur[r.pk]=r.v; by[r.metric.id]=cur; });
      const outs=Object.keys(by).map(id=>({coll:'wbr_metrics', obj:Object.assign({},metricMap[id],{plan:by[id]})}));
      if(outs.length){ store.writeMany(outs); logAct('bulk','', outs.length+' metric'+(outs.length===1?'':'s'), [{k:'plan pasted', from:'', to:rows.length+' cell'+(rows.length===1?'':'s')}]); }

    },
    setGoalMode:(metric, pk, mode)=>{ // mode: 'plan' | 'manual' | null to clear the month override

    setHidden:(metric, which, val)=>{

      store.writeEntity('wbr_metrics', Object.assign({},metric,{[k]:!!val}));
    },
    setGoal:(metric, pk, goal)=>{
      const g=Object.assign({},metric.goals||{});
      if(goal==null) delete g[pk]; else g[pk]=goal;
      const next=Object.assign({},metric,{goals:g});
      logAct('updated', metric.id, metric.name||'', [{k:'goal '+wbrMonthShort(pk), from:wbrFmtV(wbrGoal(metric,pk),metric.fmt), to:wbrFmtV(goal,metric.fmt)}]);
      store.writeEntity('wbr_metrics', next);
    },
    writePeriod:(p)=>store.writeEntity('wbr_periods', p),
    captureWeek:(period, wkId, on)=>{
      const who=actorPerson? actorPerson.name : (actorEmailLc? actorEmailLc.split('@')[0] : 'Someone');
      const weeks=(period.weeks||[]).map(w=> w.id!==wkId? w

    /* Metric order is one global sequence. Moving a row renumbers only the slice that

    reorderMetrics:(fromId, toId)=>{

      ids.forEach(id=>{ const m=metricMap[id]; if(m) outs.push({coll:'wbr_metrics', obj:Object.assign({},m,patch)}); });
      if(outs.length){ store.writeMany(outs); logAct('bulk','', outs.length+' metric'+(outs.length===1?'':'s'), [{k:label||'updated', from:'', to:String(outs.length)}]); }

    deleteMetrics:(ids)=>{
      let n=0;
      ids.forEach(id=>{
        const m=metricMap[id]; if(!m) return;
        entries.filter(e=>e.mid===id).forEach(e=>store.deleteEntity('wbr_entries', e.id));
        store.deleteEntity('wbr_metrics', id); n++;
      });
      if(n) logAct('bulk','', n+' metric'+(n===1?'':'s'), [{k:'deleted', from:'', to:String(n)}]);
      return n;
    },
    clearReadings:()=>{
      const n=entries.length;
      entries.forEach(e=>store.deleteEntity('wbr_entries', e.id));
      (periods||[]).forEach(p=>{
        const weeks=(p.weeks||[]).map(w=>{ const c=Object.assign({},w); delete c.capturedAt; delete c.capturedBy; return c; });
        store.writeEntity('wbr_periods', Object.assign({},p,{weeks}));
      });
      logAct('bulk','', n+' reading'+(n===1?'':'s'), [{k:'cleared', from:String(n), to:'0'}]);
      return n;
    },
    deletePeriod:(id)=>store.deleteEntity('wbr_periods', id),
    openPeriod:(pk, copyGoalsFrom)=>{
      const p=wbrMakePeriod(pk,S);
      store.writeEntity('wbr_periods', p);
      if(copyGoalsFrom){
        const outs=[];
        metrics.forEach(m=>{
          const src=(m.goals||{})[copyGoalsFrom];
          if(src!=null){ const g=Object.assign({},m.goals||{}); g[pk]=src; outs.push({coll:'wbr_metrics', obj:Object.assign({},m,{goals:g})}); }
        });
        if(outs.length) store.writeMany(outs);
      }
      logAct('created','', wbrMonthLabel(pk)+' period');
      return p;
    },
    writeSettings:(patch)=>store.writeWbrSettings(patch),
  };

  return {S, metrics, entries, periods, periodKeys, entryMap, metricMap, secMap, people,
          entryFor, ownerOf, timeline, resolver, read, planAt, A, mode:store.mode, flash:store.flash};
}

function wbrMonthsOfQKey(qk){

  if(!y||q<0||q>3) return [];
