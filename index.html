/* Build the finance rows and spread any old quarterly targets across the months.
   A level (rate, average, balance) repeats across the quarter. A flow is split
   three ways. Returns {metrics:[...], patches:{id:{plan}}} - callers merge. */
function wbrBuildFinance(existingById, oldTargets){
  const out=[], patch={};
  const base=(key,label,fmt,dir,agg,num)=>({
    id:'wm_fin_'+key, sec:'finance', name:label, cad:'MTD', agg, dir, fmt, band:10,
    num:900+num, goalDefault:null, goals:{}, plan:{}, goalMode:'auto', goalModeBy:{},
    hideWbr:true, hidePlan:false, archived:false, okrIds:[], scIds:[], def:'',
    goalSrc:'Model', srcNote:'Headcount & Cost model', ownerId:'', ownerName:'Kev',
  });
  WBR_FIN_LINES.forEach((l,i)=>{ if(!existingById['wm_fin_'+l[0]]) out.push(base(l[0],l[1],l[2],l[3],l[4],i)); });
  const byId={}; out.forEach(m=>{byId[m.id]=m;});
  Object.keys(oldTargets||{}).forEach(key=>{
    const id=wbrFinMetricId(key);
    const m=byId[id]||existingById[id];
    if(!m) return;
    const plan=Object.assign({}, m.plan||{});
    Object.keys(oldTargets[key]||{}).forEach(qk=>{
      const v=oldTargets[key][qk];
      if(v==null||isNaN(v)) return;
      const months=wbrMonthsOfQKey(qk);
      const each = m.agg==='cum' ? Number(v)/3 : Number(v);
      months.forEach(k=>{ if(plan[k]==null) plan[k]=Math.round(each*100)/100; });
    });
    if(byId[id]) byId[id].plan=plan; else patch[id]=plan;
  });
  return {metrics:out, patch};
}

/* ------------------------------------------------------------
   PRIOR PERIOD COMPARISON
   Comparing week 2 of this month against week 1 of this month says very
   little. Comparing it against all of last month says less than nothing,
   because 11 elapsed business days are being held up against 22. So find
   the checkpoint in the previous period that sat at the same share of its
   working days, and compare like with like.
   ------------------------------------------------------------ */
function wbrPriorRef(pk, week, periods, S){
  if(!week) return null;
  const ppk=wbrShiftMonth(pk,-1);
  const pp=wbrPeriodOf(periods,ppk,S);
  const weeks=pp.weeks||[];
  if(!weeks.length) return null;
  const cur=wbrPeriodOf(periods,pk,S);
  const curTotal=wbrBizDays(cur.start,cur.end,cur.holidays);
  const curAsOf=week.date>cur.end? cur.end : week.date;
  const curElapsed=wbrBizDays(cur.start,curAsOf,cur.holidays);
  const want=curTotal? curElapsed/curTotal : 1;
  const ppTotal=wbrBizDays(pp.start,pp.end,pp.holidays);
  let best=null, bestGap=Infinity;
  weeks.forEach(w=>{
    const asOf=w.date>pp.end? pp.end : w.date;
    const el=wbrBizDays(pp.start,asOf,pp.holidays);
    const f=ppTotal? el/ppTotal : 1;
    const gap=Math.abs(f-want);
    if(gap<bestGap){ bestGap=gap; best={w, elapsed:el, frac:f}; }
  });
  if(!best) return null;
  /* every prior checkpoint with its elapsed share, so a cumulative metric can be
     read at exactly the share this checkpoint has reached rather than the nearest one */
  const points=weeks.map(w=>{
    const asOf=w.date>pp.end? pp.end : w.date;
    const el=wbrBizDays(pp.start,asOf,pp.holidays);
    return {wk:w.id, label:w.label, elapsed:el, frac: ppTotal? el/ppTotal : 1};
  }).sort((a,b)=>a.frac-b.frac);
  return {pk:ppk, wk:best.w.id, month:wbrMonthShort(ppk),
    label:wbrMonthShort(ppk)+' '+best.w.label,
    elapsed:best.elapsed, total:ppTotal,
    curElapsed, curTotal, want, points};
}

/* ------------------------------------------------------------
   Read the previous period at the SAME share of its working days.

   A cumulative month-to-date number is only comparable at the same point
   in the month. If this checkpoint sits at 70% and last month's nearest
   was 65%, the honest move is to read last month at 70% by interpolating
   between the checkpoints either side of it. Rates, averages, trailing
   windows and forecasts need none of this - a rate at 65% elapsed is
   already comparable to a rate at 70% - so they are left alone.
   ------------------------------------------------------------ */
function wbrPriorReading(metric, ref, resolver){
  if(!ref) return null;
  const val=(wk)=>resolver.value(metric.id, ref.pk, wk);
  const paces = metric.cad==='MTD' && metric.agg==='cum';
  if(!paces){
    const v=val(ref.wk);
    return v==null? null : {value:v, basis:'direct', label:ref.label,
      note:'Compared with '+ref.label+'. This reading is a rate or a complete window, so the elapsed share does not change it.'};
  }
  const pts=(ref.points||[]).map(p=>Object.assign({},p,{v:val(p.wk)})).filter(p=>p.v!=null);
  if(!pts.length) return null;
  const want=ref.want;
  let lo=null, hi=null;
  pts.forEach(p=>{
    if(p.frac<=want && (!lo || p.frac>lo.frac)) lo=p;
    if(p.frac>=want && (!hi || p.frac<hi.frac)) hi=p;
  });
  const pct=(f)=>Math.round(f*100)+'%';
  if(lo && hi && lo.wk===hi.wk)
    return {value:lo.v, basis:'exact', label:lo.label,
      note:'Compared with '+ref.month+' '+lo.label+', which landed on the same '+pct(want)+' of the month.'};
  if(lo && hi && hi.frac>lo.frac){
    const t=(want-lo.frac)/(hi.frac-lo.frac);
    return {value:lo.v+(hi.v-lo.v)*t, basis:'interpolated', label:lo.label+' to '+hi.label,
      note:'Read at '+pct(want)+' of '+ref.month+', interpolated between '+lo.label+' at '+pct(lo.frac)+' and '+hi.label+' at '+pct(hi.frac)+', so both sides cover the same share of the month.'};
  }
  const only=lo||hi;
  if(!only || !only.frac) return null;
  return {value:only.v*(want/only.frac), basis:'scaled', label:only.label,
    note:'Scaled from '+ref.month+' '+only.label+' at '+pct(only.frac)+' up to '+pct(want)+' of the month, since there is no later checkpoint to interpolate against.'};
}

  const [lens,setLens]=useState('all');

  const [selMode,setSelMode]=useState(false); const [sel,setSel]=useState({});

  const ctxs=useMemo(()=>wbrCtxMap(period,week,W.periods,W.S),[period,week,W.periods]);
  const live=useMemo(()=>W.metrics.filter(wbrInWbr),[W.metrics]);
  const meId=(W.people.find(p=>p.email && W.mode==='cloud')||{}).id;

  const prevRef=useMemo(()=>wbrPriorRef(pk,week,W.periods,W.S),[pk,week,W.periods,W.S]);

  const readOf=useCallback((m)=>W.read(m,pk,week?week.id:'',ctxs[m.cad]||ctxs.MTD),[ctxs,W,pk,week]);
  const prevOf=useCallback((m)=>wbrPriorReading(m,prevRef,W.resolver),[prevRef,W.resolver]);

  const passes=useCallback((m)=>{

/* ============================================================
   COST MODEL
   ------------------------------------------------------------
   Cost is stored as ROWS, not as pre-aggregated totals. One row per
   person per allocation slot per month, carrying the amount plus every
   dimension it might later be sliced by. Inbound CAC is therefore a
   query rather than a stored field, which means a dimension added in
   two years can still be asked of data written today. Aggregates throw
   that away at write time and the history can never answer.

   About 60 rows a month for a team this size, so roughly 750 a year.
   Nothing, and worth far more than the bytes it costs.
   ============================================================ */

/* HC_BUCKETS is already declared above with the roster constants - reuse it. */
const HC_SHARED_ALLOC = {
  volume: {label:'Split by volume',      hint:'Unattributed cost is divided across slices in proportion to their deal volume. Slices then add up to the bundled number. This is how this workspace has always worked.'},
  direct: {label:'Split by direct cost', hint:'Unattributed cost is divided in proportion to each slice\u2019s own attributed cost. Favours whichever slice already carries more headcount.'},
  full:   {label:'Full to every slice',  hint:'Every slice carries 100% of unattributed cost. Gives a true fully-loaded figure per slice, but slices will not add up to the bundled number.'},
  none:   {label:'Exclude it',           hint:'Slices carry only cost attributed directly to them. Honest about what is actually known, but understates every slice.'},
};

const HC_DEFAULT_SLICES = [{id:'inbound',label:'Inbound'},{id:'outbound',label:'Outbound'}];
/* Marketing landing on inbound used to be a string comparison inside the engine.
   It is a policy, not a law, so it lives here as an editable rule instead. */
const HC_DEFAULT_SLICE_RULES = [{tag:'Marketing', slice:'inbound'}];

const HC_MODEL_PRESETS = [
  {id:'gtm_full', label:'Fully loaded GTM', buckets:['CAC'], excludeTags:[], sharedAlloc:'volume',
   note:'Every acquisition cost the roster carries, with unattributed cost spread by volume. This is the definition this workspace has always used.'},
  {id:'sm_only', label:'Sales and marketing only', buckets:['CAC'], excludeTags:['Implementation','Onboarding','Enablement','Data'], sharedAlloc:'volume',
   note:'The narrow definition most SaaS benchmarks are quoted on. Useful for comparing outward, misleading for deciding where to spend.'},
  {id:'public_co', label:'Public company method', buckets:['CAC'], excludeTags:['Implementation'], sharedAlloc:'volume',
   note:'Implementation treated as cost of revenue rather than acquisition, which is how most public filers present it.'},
];

/* Resolve which slice a cost slot belongs to. Legacy records store the slice label
   in the channel field, so match on label or id, then fall back to the tag rules. */
function hcSliceId(ch, tag, S){
  const slices=S.slices||HC_DEFAULT_SLICES;
  const key=String(ch||'').trim().toLowerCase();
  if(key){
    const hit=slices.find(s=>String(s.id).toLowerCase()===key || String(s.label).toLowerCase()===key);
    if(hit) return hit.id;
  }
  const rule=(S.sliceRules||[]).find(r=>r.tag && r.tag===tag);
  return rule? rule.slice : '';
}

/* One month of cost, as rows. Names and tags are denormalised on purpose: the row has
   to keep meaning after somebody is reallocated or leaves. */
function hcCostRows(hc, pk){
  const S=hcEffSettings(hc.settings);
  const out=[];
  (hc.employees||[]).filter(e=>hcStatus(e)==='active').forEach(e=>{
    const fl=hcEmpFL(e);
    [[e.c1,e.w1,e.t1,e.ch1,1],[e.c2,e.w2,e.t2,e.ch2,2],[e.c3,e.w3,e.t3,e.ch3,3]].forEach(sl=>{
      const c=sl[0], w=parseFloat(sl[1])||0, t=sl[2], ch=sl[3], n=sl[4];
      if(!c || !w) return;
      out.push({
        id:'cr_'+pk+'_'+e.id+'_'+n, pk, empId:e.id, name:e.name||'', slot:n,
        bucket:c, tag:t||'(untagged)', slice:hcSliceId(ch,t,S),
        leaderId:e.leaderId||'', country:e.country||'', level:e.level||null,
        weight:w, amountMo:(fl*(w/100))/12,
      });
    });
  });
  return out;
}

/* Run a payback model over a set of rows. Returns cost and CAC per slice plus the
   bundled figure, which needs no attribution at all and is therefore always correct. */
function hcRunModel(rows, model, S, volumes){
  const slices=S.slices||HC_DEFAULT_SLICES;
  const buckets=model.buckets&&model.buckets.length? model.buckets : ['CAC'];
  const excl=model.excludeTags||[];
  const alloc=model.sharedAlloc||'volume';
  const add=parseFloat(model.perDealAdd)||0;

  const acq=rows.filter(r=>buckets.indexOf(r.bucket)>-1 && excl.indexOf(r.tag)<0);
  const totalCost=acq.reduce((a,r)=>a+r.amountMo,0);
  const direct={}; slices.forEach(s=>{ direct[s.id]=0; });
  let unatt=0;
  acq.forEach(r=>{ if(r.slice && direct[r.slice]!==undefined) direct[r.slice]+=r.amountMo; else unatt+=r.amountMo; });

  const totVol=slices.reduce((a,s)=>a+(parseFloat(volumes[s.id])||0),0);
  const totDirect=slices.reduce((a,s)=>a+direct[s.id],0);

  const bySlice={};
  slices.forEach(s=>{
    const v=parseFloat(volumes[s.id])||0;
    let share=0;
    if(alloc==='volume') share = totVol>0? unatt*(v/totVol) : 0;
    else if(alloc==='direct') share = totDirect>0? unatt*(direct[s.id]/totDirect) : 0;
    else if(alloc==='full') share = unatt;
    const cost=direct[s.id]+share;
    bySlice[s.id]={volume:v, direct:direct[s.id], shared:share, cost, perDeal: v>0? cost/v+add : null};
  });

  return {bySlice, unattributed:unatt, totalCost, totalVolume:totVol,
    coverage: totalCost>0? (totDirect/totalCost)*100 : 0,
    bundled:{volume:totVol, cost:totalCost, perDeal: totVol>0? totalCost/totVol+add : null},
    sums: alloc!=='full' && alloc!=='none'};
}

/* Months to recover acquisition cost out of gross margin. */
function hcPayback(perDeal, arpu, gmPct){
  if(!perDeal || !arpu || !gmPct || gmPct<=0) return null;
  return perDeal/(arpu*gmPct/12);
}

function useHcCostRows(){
  const store=useStore();
  const rows=store.state.hc_cost_rows||[];
  const byPeriod=useMemo(()=>{

  },[rows]);
  return {rows, byPeriod, periods:Object.keys(byPeriod).sort(),
    write:(rs)=>store.writeMany(rs.map(r=>({coll:'hc_cost_rows', obj:r}))),
    clear:(pk)=>rows.filter(r=>r.pk===pk).forEach(r=>store.deleteEntity('hc_cost_rows', r.id))};
}

function wbrSecHealth(c){
  const scored=(c.good||0)+(c.warn||0)+(c.bad||0);
  if(!scored) return {label:'Not reported', tone:null};
  const bad=(c.bad||0)/scored, risk=((c.warn||0)+(c.bad||0))/scored;
  if(!c.bad && risk<=1/3) return {label:'Strong', tone:'good'};
  if(bad<=1/3) return {label:'At risk', tone:'warn'};
  return {label:'Off plan', tone:'bad'};
}

/* ============================================================
   COMPUTED METRICS
   ------------------------------------------------------------
   A metric either gets its number typed in each week, or it works
   itself out from other metrics. Formulas are written against short
   input letters rather than metric names, because names repeat
   ("Total Go-lives" appears twice, "Headcount (Total)" seven times)
   and a letter is unambiguous, short to type, and reads like a
   spreadsheet:

       inputs   A = MQLs (Organic)      B = SQLs (inbound)
       formula  B / A * 100

   Nothing is stored. Values resolve at read time, memoized, with a
   guard so a formula that ends up referring back to itself returns
   nothing rather than hanging the page.
   ============================================================ */
const WBR_KIND={
  entered:{label:'Entered each week', hint:'Somebody types the number in during the review.'},
  computed:{label:'Worked out from other metrics', hint:'The number is calculated from other metrics every time it is read, so it can never drift out of step with them.'},
};
const WBR_FN_HELP=[
  ['A / B','a ratio'],
  ['A / B * 100','a percentage'],
  ['A + B + C','a total'],
  ['A - prev(A)','the change since the last checkpoint'],
  ['(A * C + B * D) / (C + D)','a weighted blend'],
];
const WBR_FN_NAMES=['prev','min','max','abs','round','sum','avg'];

function wbrLex(src){
  const out=[]; const s=String(src||''); let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/[0-9.]/.test(c)){
      let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      const n=parseFloat(s.slice(i,j));
      if(isNaN(n)) throw new Error('Could not read the number "'+s.slice(i,j)+'"');
      out.push({t:'num',v:n}); i=j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j=i; while(j<s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
      out.push({t:'id',v:s.slice(i,j)}); i=j; continue;
    }
    if('+-*/^(),'.indexOf(c)>-1){ out.push({t:c}); i++; continue; }
    throw new Error('A formula cannot use "'+c+'"');
  }
  return out;
}
function wbrParse(tokens){
  let p=0;
  const peek=()=>tokens[p];
  function expr(){ let n=term(); while(peek() && (peek().t==='+'||peek().t==='-')){ const op=tokens[p++].t; n={t:'bin',op,a:n,b:term()}; } return n; }
  function term(){ let n=unary(); while(peek() && (peek().t==='*'||peek().t==='/')){ const op=tokens[p++].t; n={t:'bin',op,a:n,b:unary()}; } return n; }
  function unary(){ if(peek() && peek().t==='-'){ p++; return {t:'neg',a:unary()}; } return power(); }
  function power(){ const n=primary(); if(peek() && peek().t==='^'){ p++; return {t:'bin',op:'^',a:n,b:unary()}; } return n; }
  function primary(){
    const k=peek();
    if(!k) throw new Error('The formula stops before it is finished');
    if(k.t==='num'){ p++; return {t:'num',v:k.v}; }
    if(k.t==='('){ p++; const n=expr(); if(!peek()||peek().t!==')') throw new Error('A bracket was opened and never closed'); p++; return n; }
    if(k.t==='id'){
      p++;
      if(peek() && peek().t==='('){
        p++; const args=[];
        if(peek() && peek().t!==')'){ args.push(expr()); while(peek() && peek().t===','){ p++; args.push(expr()); } }
        if(!peek()||peek().t!==')') throw new Error('A bracket was opened and never closed');
        p++;
        const nm=k.v.toLowerCase();
        if(WBR_FN_NAMES.indexOf(nm)<0) throw new Error('There is no function called '+k.v);

  });

    if(d) return d;

function wbrMakeResolver(metrics, entryMap, timeline){
  const byId={}; (metrics||[]).forEach(m=>{ byId[m.id]=m; });

  const inputsOf=(m)=>{ const o={}; (m.inputs||[]).forEach(x=>{ if(x&&x.mid) o[String(x.k).toUpperCase()]=x.mid; }); return o; };

  function value(id,pk,wk){
    const key=id+'|'+pk+'|'+wk;
    if(key in cache) return cache[key];
    const m=byId[id];
    if(!m){ cache[key]=null; return null; }
    if(!wbrIsComputed(m)){
      const e=entryMap[WBR_ENTRY_ID(id,pk,wk)];
      const v=(e && e.v!=null && !isNaN(e.v))? Number(e.v) : null;
      cache[key]=v; return v;

    if(busy[key]){ errs[id]='This formula ends up asking for itself'; cache[key]=null; return null; }
    busy[key]=true;
    const c=ast(m);

    if(c.ok){
      const inp=inputsOf(m);
      const i=tIdx[pk+'|'+wk];
      const before=(i!=null && i>0)? timeline[i-1] : null;

          ref:(k)=>{ const mid=inp[k]; return mid? value(mid,pk,wk) : null; },
          prev:(k)=>{ const mid=inp[k]; if(!mid||!before) return null; return value(mid,before.pk,before.wk); },
        });

  function plan(id,pk){

    if(!m){ planCache[key]=null; return null; }
    const own=wbrPlanGoal(m,pk);
    if(!wbrIsComputed(m) || !m.planFormula){ planCache[key]=own; return own; }
    if(planBusy[key]){ planCache[key]=null; return null; }
    planBusy[key]=true;
    const c=ast(m);
    let out=null;
    if(c.ok){

      try{ out=wbrEvalAst(c.ast,{ ref:(k)=>{ const mid=inp[k]; return mid? plan(mid,pk) : null; }, prev:()=>null }); }
      catch(e){ out=null; }

    planCache[key]= out!=null? out : own;

  function entry(m,pk,wk){
    const stored=entryMap[WBR_ENTRY_ID(m.id,pk,wk)]||null;
    if(!wbrIsComputed(m)) return stored;
    const v=value(m.id,pk,wk);
    return {id:WBR_ENTRY_ID(m.id,pk,wk), mid:m.id, pk, wk, v, raw:'', note:stored?stored.note:''};
  }

    [gran,months,year]);

  const rows=useMemo(()=>W.metrics.filter(m=>!m.archived && (showHidden||!m.hidePlan)),[W.metrics,showHidden]);
  const groups=useMemo(()=>{

    const known={}; W.S.sections.forEach(s=>{known[s.id]=1;});

    Object.keys(by).forEach(k=>{ if(!known[k]) out.push({sec:{id:k,label:k||'Unsorted'}, rows:by[k]}); });
    return out;

  const hiddenCount=W.metrics.filter(m=>!m.archived && m.hidePlan).length;

          React.createElement(Icon,{name:'info',size:13}))):null,

          iLabel('rotate-ccw','Fill blanks from goals',13)),
        React.createElement('button',{className:'btn sm',disabled:gran!=='month',onClick:()=>setModal({type:'ingest'})},

      return React.createElement(WbrSection,{key:g.sec.id,title:g.sec.label,count:g.rows.length,open:opn,
        onToggle:()=>setOpen(o=>Object.assign({},o,{[g.sec.id]:!opn}))},
        React.createElement('div',{className:'wbr-scroll'},
          React.createElement('table',{className:'tbl wbr-tbl norow'},

              cols.map(c=>React.createElement('th',{key:c.key,className:'r',style:{width:gran==='month'?86:120}},

/* ============================================================
   DASHBOARD
   ------------------------------------------------------------
   Small multiples by default. Ten metrics side by side, each on its
   own scale, each with its plan drawn behind the actual, and the
   week a note was written marked on the line. Comparing many series
   on one axis is what turns a report into wallpaper, so the shared
   axis is opt in and only ever shows comparable numbers.
   ============================================================ */
const WBR_RANGES=[['30','Last 30 days'],['90','Last 90 days'],['180','Last 6 months'],
  ['365','Last 12 months'],['q','This quarter'],['y','This year'],['all','All time'],['custom','Custom range']];
/* Relative presets deliberately leave the top end open. Checkpoints can sit a few days
   ahead of today and still hold readings, and clipping them makes the filter look broken. */
function wbrRangeBounds(key, cFrom, cTo){
  const t=wbrToday();
  if(key==='custom') return {from:cFrom||'', to:cTo||''};
  if(key==='all')    return {from:'', to:''};
  if(key==='q'){ const q=wbrQuarterBounds(wbrMonthKey(t)); return {from:q.start, to:q.end}; }
  if(key==='y'){ const y=t.slice(0,4); return {from:y+'-01-01', to:y+'-12-31'}; }
  const d=wbrD(t); d.setDate(d.getDate()-(parseInt(key,10)||90));
  return {from:wbrISO(d), to:''};
}
const WBR_VALMODE={
  pace:{label:'Pace', hint:'The full period run rate. Comparable week to week, because a month to date reading on its own is always low early in the month.'},
  actual:{label:'Actual', hint:'The raw reading at each checkpoint.'},
  pct:{label:'% to plan', hint:'Every metric on one scale, read in its own direction. The only honest way to put them on a shared axis.'},
};
const WBR_MAX_PICK=10;

function wbrNiceTicks(lo,hi,n){
  if(!(hi>lo)) return [lo];
  const span=hi-lo, raw=span/(n||4), mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  const norm=raw/mag, step=(norm>=5?10:norm>=2?5:norm>=1?2:1)*mag;
  const out=[]; let v=Math.ceil(lo/step)*step;
  while(v<=hi+1e-9 && out.length<9){ out.push(v); v+=step; }
  return out;
}
/* one line, drawn as segments so a gap in the data reads as a gap */
function wbrPath(vals, X, Y){
  const segs=[]; let cur=[];
  vals.forEach((v,i)=>{
    if(v==null){ if(cur.length) segs.push(cur); cur=[]; return; }
    cur.push(X(i)+','+Y(v));
  });
  if(cur.length) segs.push(cur);
  return segs.map(s=>'M'+s.join('L')).join(' ');
}
/* One chart, one shared vertical scale, however many lines. The viewBox width is
   passed in rather than fixed so text renders at roughly the same size whether it
   is a small card or the full width chart. */
function WbrChart({lines, axis, fmt, baseZero, height, vw, showAxis}){
  const H=height||190, VW=vw||460, PL=showAxis===false?6:44, PR=10, PT=12, PB=24;
  const vals=[];
  (lines||[]).forEach(l=>(l.vals||[]).forEach(v=>{ if(v!=null) vals.push(v); }));
  if(!vals.length || !axis.length) return React.createElement('div',{className:'wbr-nochart'},'Nothing recorded yet');
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(baseZero && lo>0) lo=0;
  if(hi===lo){ const s=(Math.abs(lo)||1)*0.1; hi=lo+s; lo=lo-s; }
  const pad=(hi-lo)*0.12; hi+=pad; if(!baseZero||lo<0) lo-=pad;
  const X=(i)=> PL + (axis.length<2? (VW-PL-PR)/2 : (i/(axis.length-1))*(VW-PL-PR));
  const Y=(v)=> PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);
  const ticks=wbrNiceTicks(lo,hi,4);
  const labelAt=[0, Math.floor((axis.length-1)/2), axis.length-1].filter((v,i,a)=>a.indexOf(v)===i && v>=0);
  return React.createElement('svg',{className:'wbr-svg',viewBox:'0 0 '+VW+' '+H,role:'img'},
    ticks.map((t,i)=>React.createElement('line',{key:'g'+i,x1:PL,x2:VW-PR,y1:Y(t),y2:Y(t),className:'wbr-grid'})),
    showAxis!==false && ticks.map((t,i)=>React.createElement('text',{key:'t'+i,x:PL-7,y:Y(t)+3.5,className:'wbr-ax r'},wbrFmtV(t,fmt))),
    labelAt.map(i=>React.createElement('text',{key:'x'+i,x:X(i),y:H-7,
      className:'wbr-ax'+(i===0?' s':i===axis.length-1?' e':'')},wbrDayLabel(axis[i].date))),
    (lines||[]).map((l,li)=>React.createElement('path',{key:'l'+li,d:wbrPath(l.vals,X,Y),
      className:l.dashed?'wbr-goalline':'wbr-line', style:l.stroke?{stroke:l.stroke}:null})),
    (lines||[]).map((l,li)=> !l.dots? null : (l.vals||[]).map((v,i)=> v==null? null :
      React.createElement('circle',{key:'p'+li+'-'+i,cx:X(i),cy:Y(v),r:(l.notes&&l.notes[i])?4.2:2.6,
        className:'wbr-pt'+((l.notes&&l.notes[i])?' noted':''), style:l.stroke?{fill:l.stroke}:null},
        React.createElement('title',null, axis[i].label+' \u00b7 '+wbrDayLabel(axis[i].date)+'\n'+wbrFmtV(v,fmt)
          +((l.pcts&&l.pcts[i]!=null)?'\n'+wbrTrim(l.pcts[i],1)+'% to plan':'')
          +((l.notes&&l.notes[i])?'\n\n'+l.notes[i]:''))))),
    (lines||[]).map((l,li)=>{
      if(!l.lastTone) return null;
      let idx=-1; (l.vals||[]).forEach((v,i)=>{ if(v!=null) idx=i; });
      if(idx<0) return null;
      return React.createElement('circle',{key:'z'+li,cx:X(idx),cy:Y(l.vals[idx]),r:4.6,
        style:{fill:l.stroke||WBR_TONE_C[l.lastTone]||WBR_TONE_C.none}});
    }));
}

function WbrDashboard(){
  const [mode,setMode]=useState('charts');
  return React.createElement('div',null,

function hcInits(n){return String(n||'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function hcEmpFL(e){return e.ote?e.ote*HC_FLM:0;}
function hcPct(n,d){return d>0?(n/d)*100:0;}
function hcMean(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;}
function hcMedian(arr){if(!arr.length)return null;const s=arr.slice().sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function hcStatus(e){ return (e&&e.status)||'active'; }
function hcNextReq(records){ let n=0; (records||[]).forEach(r=>{ if(r.reqNumber&&r.reqNumber>n)n=r.reqNumber; }); return n+1; }
function hcBuildRecords(employees, reqs){
  employees=employees||[]; reqs=reqs||[];
  let n=0;
  employees.forEach(e=>{ if(e.reqNumber&&e.reqNumber>n)n=e.reqNumber; });
  reqs.forEach(r=>{ if(r.reqNumber&&r.reqNumber>n)n=r.reqNumber; });
  const out=[];
  const empsSorted=employees.slice().sort((a,b)=>String(a.startDate||'9999-99').localeCompare(String(b.startDate||'9999-99')));
  empsSorted.forEach(e=>{ const rec=Object.assign({},e,{status:e.status||'active'}); if(!rec.reqNumber)rec.reqNumber=++n; if(rec.title==null)rec.title=''; out.push(rec); });
  reqs.forEach(r=>{ out.push({ id:r.id||uid('e'), reqNumber:r.reqNumber||(++n), status:'open',
    leaderId:r.leaderId, title:r.title||r.role||'', role:r.role||'', level:r.level||2, manager:r.manager||'',
    teamTags:Array.isArray(r.teamTags)?r.teamTags:[], targetOte:r.targetOte||null, openReason:r.notes||'',
    name:'', ote:null, country:'USA', startDate:'', performance:'Good', attrition:'', onLeave:false, notes:'',
    c1:'CAC',w1:100,t1:(r.teamTags&&r.teamTags[0])||'',ch1:'',c2:'',w2:0,t2:'',ch2:'',c3:'',w3:0,t3:'',ch3:'', openedAt:nowISO() }); });
  return out;
}

/* ---- effective settings + leaders (built-in defaults + DB overrides) ---- */
function hcEffSettings(hs){
  hs = hs || {};
  return {
    arr: hs.arr!=null?hs.arr:27000000,
    dealsInbound: hs.dealsInbound!=null?hs.dealsInbound:150,
    dealsOutbound: hs.dealsOutbound!=null?hs.dealsOutbound:14,
    dealPeriod: hs.dealPeriod||'monthly',
    perDealCac: hs.perDealCac!=null?hs.perDealCac:0,
    arpuInbound: hs.arpuInbound!=null?hs.arpuInbound:4000,
    arpuOutbound: hs.arpuOutbound!=null?hs.arpuOutbound:5500,
    otherGmHitPct: hs.otherGmHitPct!=null?hs.otherGmHitPct:12,
    teamTags: Array.isArray(hs.teamTags)?hs.teamTags:HC_DEFAULT_TAGS.slice(),
    passwords: Object.assign({}, HC_DEFAULT_PW, hs.passwords||{}),
    plan: (hs.plan&&typeof hs.plan==='object')?hs.plan:{},
    slices: (Array.isArray(hs.slices)&&hs.slices.length)? hs.slices : HC_DEFAULT_SLICES.slice(),
    sliceRules: Array.isArray(hs.sliceRules)? hs.sliceRules : HC_DEFAULT_SLICE_RULES.slice(),
    sliceVolumes: (hs.sliceVolumes&&typeof hs.sliceVolumes==='object')? hs.sliceVolumes : {},
    sliceArpu: (hs.sliceArpu&&typeof hs.sliceArpu==='object')? hs.sliceArpu : {},
    payModels: (Array.isArray(hs.payModels)&&hs.payModels.length)? hs.payModels : HC_MODEL_PRESETS.slice(),
  };
}
function hcLeaders(hc){
  const base = (Array.isArray(hc.leaders)&&hc.leaders.length)?hc.leaders.map(l=>({...l})):HC_BUILTIN_LEADERS.map(l=>({...l}));
  // department-leader employees override the "kev" display name for their org
  (hc.employees||[]).forEach(e=>{
    if((e.teamTags||[]).includes(HC_DL_TAG)){ const l=base.find(x=>x.id===e.leaderId); if(l) l.kev=e.name; }
  });
  return base;
}

/* ============================================================
   FINANCE ENGINE  (pure - takes the hc slice + effective settings)
   ============================================================ */
function hcCalcFin(hc){
  const S = hcEffSettings(hc.settings);
  const leaders = hcLeaders(hc);
  const employees = (hc.employees||[]).filter(e=>hcStatus(e)==='active');
  const reqs = (hc.employees||[]).filter(e=>hcStatus(e)==='open');
  const byLeader={}; leaders.forEach(l=>{byLeader[l.id]={CAC:0,COGS:0,'G&A':0,OpEx:0,headcount:0,onLeave:0,openReqs:0,poor:0,attrition:0,negAttrition:0,posAttrition:0,promoAttrition:0,ote:0};});
  const cacByType={},cogsByType={},gaByType={},opexByType={};
  const byTeam={}; S.teamTags.forEach(t=>{byTeam[t]={CAC:0,COGS:0,'G&A':0,OpEx:0,headcount:0,poor:0,attrition:0};});
  const byCountry={};
  let tCAC=0,tCOGS=0,tGA=0,tOpEx=0,tHC=0,tLeave=0,tPoor=0,tAttr=0,tNegAttr=0,tPosAttr=0,tPromoAttr=0,tReqs=0,tOTE=0;
  let cacInbSales=0,cacOutbSales=0,cacMktg=0,cacShared=0;

  employees.forEach(e=>{
    const fl=hcEmpFL(e); tHC++; tOTE+=e.ote||0;
    if(e.onLeave)tLeave++;
    if(e.performance==='Poor')tPoor++;
    if(e.attrition){tAttr++;if(e.attrition==='Negative Attrition')tNegAttr++;else if(e.attrition==='Positive Attrition')tPosAttr++;else if(e.attrition==='Promotion Attrition')tPromoAttr++;}
    const cc=e.country||'Other';
    if(!byCountry[cc])byCountry[cc]={headcount:0,fl:0,ote:0};
    byCountry[cc].headcount++; byCountry[cc].fl+=fl; byCountry[cc].ote+=e.ote||0;
    [[e.c1,e.w1,e.t1,e.ch1],[e.c2,e.w2,e.t2,e.ch2],[e.c3,e.w3,e.t3,e.ch3]].forEach(([c,w,t,ch])=>{
      if(!c||!w)return;
      const amt=fl*(w/100),tk=t||'(untagged)';
      if(c==='CAC'){tCAC+=amt;cacByType[tk]=(cacByType[tk]||0)+amt;
        if(tk==='Marketing')cacMktg+=amt; else if(ch==='Inbound')cacInbSales+=amt; else if(ch==='Outbound')cacOutbSales+=amt; else cacShared+=amt;
      }else if(c==='COGS'){tCOGS+=amt;cogsByType[tk]=(cogsByType[tk]||0)+amt;}
      else if(c==='G&A'){tGA+=amt;gaByType[tk]=(gaByType[tk]||0)+amt;}
      else if(c==='OpEx'){tOpEx+=amt;opexByType[tk]=(opexByType[tk]||0)+amt;}
    });
    if(byLeader[e.leaderId]){
      const bl=byLeader[e.leaderId];
      [[e.c1,e.w1],[e.c2,e.w2],[e.c3,e.w3]].forEach(([c,w])=>{if(!c||!w)return;const amt=fl*(w/100);if(c==='CAC')bl.CAC+=amt;else if(c==='COGS')bl.COGS+=amt;else if(c==='G&A')bl['G&A']+=amt;else if(c==='OpEx')bl.OpEx+=amt;});
      bl.headcount++;bl.ote+=e.ote||0;if(e.onLeave)bl.onLeave++;if(e.performance==='Poor')bl.poor++;
      if(e.attrition){bl.attrition++;if(e.attrition==='Negative Attrition')bl.negAttrition++;else if(e.attrition==='Positive Attrition')bl.posAttrition++;else if(e.attrition==='Promotion Attrition')bl.promoAttrition++;}
    }
    const tags=e.teamTags||[];
    if(tags.length>0){const perTag=1/tags.length;
      tags.forEach(tag=>{ if(!byTeam[tag])byTeam[tag]={CAC:0,COGS:0,'G&A':0,OpEx:0,headcount:0,poor:0,attrition:0};
        [[e.c1,e.w1],[e.c2,e.w2],[e.c3,e.w3]].forEach(([c,w])=>{if(!c||!w)return;const amt=fl*(w/100)*perTag;if(c==='CAC')byTeam[tag].CAC+=amt;else if(c==='COGS')byTeam[tag].COGS+=amt;else if(c==='G&A')byTeam[tag]['G&A']+=amt;else if(c==='OpEx')byTeam[tag].OpEx+=amt;});
        byTeam[tag].headcount+=perTag;if(e.performance==='Poor')byTeam[tag].poor+=perTag;if(e.attrition)byTeam[tag].attrition+=perTag;
      });
    }
  });
  reqs.forEach(r=>{tReqs++;if(byLeader[r.leaderId])byLeader[r.leaderId].openReqs++;});

  const totalGoLives=(S.dealsInbound||0)+(S.dealsOutbound||0);
  const div=S.dealPeriod==='monthly'?12:1;
  const sharedPerGoLive=totalGoLives>0?(cacShared/div)/totalGoLives:0;
  const cacPer=tCAC/div;
  const cacPerDeal=totalGoLives>0?(cacPer/totalGoLives)+S.perDealCac:null;
  const cacInbSalesPerGL=S.dealsInbound>0?((cacInbSales+cacMktg)/div)/S.dealsInbound:0;
  const cacInbPerDeal=S.dealsInbound>0?(sharedPerGoLive+cacInbSalesPerGL)+S.perDealCac:null;
  const cacOutbSalesPerGL=S.dealsOutbound>0?(cacOutbSales/div)/S.dealsOutbound:0;
  const cacOutbPerDeal=S.dealsOutbound>0?(sharedPerGoLive+cacOutbSalesPerGL)+S.perDealCac:null;
  const cacInbPer=cacInbSales+cacMktg+cacShared,cacOutbPer=cacOutbSales+cacShared;
  const gtmGmHit=S.arr>0?(tCOGS/S.arr)*100:0;
  const totalGmHit=gtmGmHit+(S.otherGmHitPct||0);
  const gmPct=Math.max(0,1-totalGmHit/100);
  function pb(cac,arpu){if(!cac||!arpu||!gmPct||gmPct<=0)return null;return cac/(arpu*gmPct/12);}
  const arpuWtd=totalGoLives>0?((S.dealsInbound||0)*(S.arpuInbound||0)+(S.dealsOutbound||0)*(S.arpuOutbound||0))/totalGoLives:0;

  return{S,leaders,byLeader,byTeam,byCountry,cacByType,cogsByType,gaByType,opexByType,
    tCAC,tCOGS,tGA,tOpEx,tHC,tLeave,tPoor,poorPct:hcPct(tPoor,tHC),tAttr,tNegAttr,tPosAttr,tPromoAttr,tReqs,tOTE,
    totalSpend:tCAC+tCOGS+tGA+tOpEx,avgFL:tHC>0?(tCAC+tCOGS+tGA+tOpEx)/tHC:0,
    gtmGmHit,totalGmHit,gmPct,cacInbSales,cacOutbSales,cacMktg,cacShared,
    cacPer,cacInbPer,cacOutbPer,cacPerDeal,cacInbPerDeal,cacOutbPerDeal,
    paybackAvg:pb(cacPerDeal,arpuWtd),paybackInb:pb(cacInbPerDeal,S.arpuInbound),paybackOutb:pb(cacOutbPerDeal,S.arpuOutbound),
    totalGoLives,arpuWtd,sharedPerGoLive};
}

/* ============================================================
   PEOPLE / HEADCOUNT REPORTING ENGINE  (tenure, level, perf, attrition)
   ============================================================ */
function hcCalcPeople(hc){
  const S = hcEffSettings(hc.settings);
  const leaders = hcLeaders(hc);
  const employees = (hc.employees||[]).filter(e=>hcStatus(e)==='active');
  const departedRecs = (hc.employees||[]).filter(e=>hcStatus(e)==='departed');
  const log = hc.attritionLog||[];

  const tenures = employees.map(e=>hcTenureMo(e.startDate)).filter(v=>v!=null);
  const levels = employees.map(e=>e.level).filter(v=>v!=null&&!isNaN(v));
  const otes = employees.map(e=>e.ote).filter(v=>v!=null);

  const perfMix = {Good:0,Poor:0,'Kev Direct':0,'N/A':0};
  employees.forEach(e=>{ const p=e.performance||'N/A'; perfMix[p]=(perfMix[p]||0)+1; });

  const tenureBuckets = {'<6mo':0,'6-12mo':0,'1-2y':0,'2y+':0};
  employees.forEach(e=>{ const m=hcTenureMo(e.startDate); if(m==null)return; if(m<6)tenureBuckets['<6mo']++; else if(m<12)tenureBuckets['6-12mo']++; else if(m<24)tenureBuckets['1-2y']++; else tenureBuckets['2y+']++; });

  const levelDist = {}; employees.forEach(e=>{ const l='L'+(e.level||'?'); levelDist[l]=(levelDist[l]||0)+1; });
  const countryDist = {}; employees.forEach(e=>{ const c=e.country||'Other'; countryDist[c]=(countryDist[c]||0)+1; });

  const newHires = employees.filter(e=>{ const m=hcTenureMo(e.startDate); return m!=null && m<3; });

  // per-org rollups
  const byLeader = {};
  leaders.forEach(l=>{
    const es = employees.filter(e=>e.leaderId===l.id);
    const ten = es.map(e=>hcTenureMo(e.startDate)).filter(v=>v!=null);
    const lv = es.map(e=>e.level).filter(v=>v!=null&&!isNaN(v));
    const poor = es.filter(e=>e.performance==='Poor').length;
    byLeader[l.id]={
      label:l.label, kev:l.kev, headcount:es.length, onLeave:es.filter(e=>e.onLeave).length,
      avgTenure:hcMean(ten), medTenure:hcMedian(ten), avgLevel:hcMean(lv),
      poor, poorPct:hcPct(poor,es.length),
      negAttr:es.filter(e=>e.attrition==='Negative Attrition').length,
      posAttr:es.filter(e=>e.attrition==='Positive Attrition').length,
      promoAttr:es.filter(e=>e.attrition==='Promotion Attrition').length,
      attr:es.filter(e=>e.attrition).length,
    };
  });

  // per-team rollups (team tag membership; whole-person, not FTE-split, for people metrics)
  const byTeam = {};
  S.teamTags.forEach(t=>{
    const es = employees.filter(e=>(e.teamTags||[]).includes(t));
    if(!es.length) return;
    const ten = es.map(e=>hcTenureMo(e.startDate)).filter(v=>v!=null);
    const lv = es.map(e=>e.level).filter(v=>v!=null&&!isNaN(v));
    const poor = es.filter(e=>e.performance==='Poor').length;
    byTeam[t]={ headcount:es.length, avgTenure:hcMean(ten), medTenure:hcMedian(ten), avgLevel:hcMean(lv),
      poor, poorPct:hcPct(poor,es.length), attr:es.filter(e=>e.attrition).length };
  });

  const totalHC = employees.length;
  const activeFlags = employees.filter(e=>e.attrition).length;
  return {
    leaders, totalHC, onLeave: employees.filter(e=>e.onLeave).length,
    openReqs:(hc.employees||[]).filter(e=>hcStatus(e)==='open').length,
    avgTenure:hcMean(tenures), medTenure:hcMedian(tenures),
    avgLevel:hcMean(levels), avgOTE:hcMean(otes),
    poor: perfMix.Poor, poorPct:hcPct(perfMix.Poor,totalHC),
    perfMix, tenureBuckets, levelDist, countryDist,
    newHires: newHires.length,
    activeFlags, attrRate:hcPct(activeFlags,totalHC),
    negActive: employees.filter(e=>e.attrition==='Negative Attrition').length,
    posActive: employees.filter(e=>e.attrition==='Positive Attrition').length,
    promoActive: employees.filter(e=>e.attrition==='Promotion Attrition').length,
    departed: departedRecs.length,
    departedNeg: departedRecs.filter(e=>e.attritionType==='Negative Attrition').length,
    departedPos: departedRecs.filter(e=>e.attritionType==='Positive Attrition').length,
    departedPromo: departedRecs.filter(e=>e.attritionType==='Promotion Attrition').length,
    byLeader, byTeam,
  };
}

const HcCtx = createContext(null);
const HC_CTX_FALLBACK = {unlocked:{},unlock:()=>{},lock:()=>{},openModal:()=>{},closeModal:()=>{}};
const useHcCtx = ()=>useContext(HcCtx)||HC_CTX_FALLBACK;

function useHc(){
  const store = useStore();
  const st = store.state;
  const comp = store.comp || {};
  // In cloud mode salary/comp lives in the locked /private_comp node - re-attach it for whoever
  // is allowed to read it (the viewer). For everyone else comp is empty, so cost math yields 0.
  const canViewComp = store.mode!=='cloud' || isCompViewer(store.user&&store.user.email);
  const mergedEmployees = useMemo(()=> store.mode==='cloud'
      ? (st.hc_employees||[]).map(e=>({...e, ...(comp[e.id]||{})}))
      : (st.hc_employees||[]),
    [st.hc_employees, comp, store.mode]);
  const hc = useMemo(()=>({
    employees: mergedEmployees,
    reqs: st.hc_reqs||[],
    attritionLog: st.hc_attritionLog||[],
    leaders: st.hc_leaders||[],
    history: st.hc_history||[],
    settings: st.hcSettings||{},
  }),[mergedEmployees,st.hc_reqs,st.hc_attritionLog,st.hc_leaders,st.hc_history,st.hcSettings]);

  const fin = useMemo(()=>hcCalcFin(hc),[hc]);
  const people = useMemo(()=>hcCalcPeople(hc),[hc]);
  const effLeaders = fin.leaders;
  const S = fin.S;

  const writeHistory=(o)=>store.writeEntity('hc_history',o);
  const historyFor=(empId)=>(hc.history||[]).filter(h=>h.empId===empId);
  const records = hc.employees||[];
  const activeEmps = records.filter(e=>hcStatus(e)==='active');
  const openReqs = records.filter(e=>hcStatus(e)==='open');
  const nextReq = hcNextReq(records);

  return {
    ...hc, fin, people, effLeaders, S, canViewComp,
    records, activeEmps, openReqs, nextReq,
    // writers (reuse the generic store entity writers)
    writeEmp:(o)=>store.writeEntity('hc_employees',o),
    deleteEmp:(id)=>store.deleteEntity('hc_employees',id),
    writeReq:(o)=>store.writeEntity('hc_reqs',o),
    deleteReq:(id)=>store.deleteEntity('hc_reqs',id),
    writeLog:(o)=>store.writeEntity('hc_attritionLog',o),
    deleteLog:(id)=>store.deleteEntity('hc_attritionLog',id),
    writeLeader:(o)=>store.writeEntity('hc_leaders',o),
    deleteLeader:(id)=>store.deleteEntity('hc_leaders',id),
    writeSettings:(patch)=>store.writeHcSettings(patch),
    writeHistory, deleteHistory:(id)=>store.deleteEntity('hc_history',id), historyFor,
    // req + hire lifecycle
    createReq:(fields)=>{
      const id=uid('e'); const reqNumber=hcNextReq(records);
      store.writeEntity('hc_employees', Object.assign({ id, reqNumber, status:'open', name:'', ote:null, country:'USA', startDate:'', performance:'Good', attrition:'', onLeave:false, notes:'', c1:'CAC',w1:100,t1:'',ch1:'',c2:'',w2:0,t2:'',ch2:'',c3:'',w3:0,t3:'',ch3:'', openedAt:nowISO() }, fields));
      writeHistory({id:uid('hh'), empId:id, type:'opened', ts:nowISO(), effectiveDate:nowISO().slice(0,10), title:fields.title||'', level:fields.level, leaderId:fields.leaderId, note:fields.openReason||''});
      return reqNumber;
    },
    hireReq:(req,next)=>{
      store.writeEntity('hc_employees', Object.assign({}, req, next, {status:'active', hiredAt:nowISO()}));
      writeHistory({id:uid('hh'), empId:req.id, type:'hired', ts:nowISO(), effectiveDate:next.startDate||nowISO().slice(0,10), name:next.name||'', role:next.role||req.role||'', title:next.title||req.title||'', level:next.level||req.level, leaderId:next.leaderId||req.leaderId});
    },
    setLeave:(emp,val)=>store.writeEntity('hc_employees', {...emp, onLeave:!!val}),
    // lifecycle actions
    attritEmp:(emp,{attritionType,exitDate,reason})=>{
      store.writeEntity('hc_employees', {...emp, status:'departed', attritionType, exitDate:exitDate||nowISO().slice(0,10), exitReason:reason||'', departedAt:nowISO(), attrition:'', onLeave:false});
      writeHistory({id:uid('hh'), empId:emp.id, type:'attrition', ts:nowISO(), attritionType, exitDate:exitDate||nowISO().slice(0,10), reason:reason||'', roleAt:emp.role||'', titleAt:emp.title||'', levelAt:emp.level, leaderIdAt:emp.leaderId});
    },
    reactivateEmp:(emp)=>{
      store.writeEntity('hc_employees', {...emp, status:'active', attritionType:'', exitDate:'', exitReason:'', departedAt:''});
    },
    removeEmp:(emp)=>{
      (hc.history||[]).filter(h=>h.empId===emp.id).forEach(h=>store.deleteEntity('hc_history',h.id));
      store.deleteEntity('hc_employees', emp.id);
    },
    moveEmp:(prev,next,kind,{effectiveDate,note})=>{
      store.writeEntity('hc_employees', next);
      writeHistory({id:uid('hh'), empId:prev.id, type:kind, ts:nowISO(), effectiveDate:effectiveDate||nowISO().slice(0,10), note:note||'',
        fromRole:prev.role||'', toRole:next.role||'', fromTitle:prev.title||'', toTitle:next.title||'',
        fromLevel:prev.level, toLevel:next.level, fromManager:prev.manager||'', toManager:next.manager||'',
        fromLeaderId:prev.leaderId, toLeaderId:next.leaderId, fromOte:prev.ote||null, toOte:next.ote||null});
    },
    flash: store.flash,
  };
}

function hcPlanFmt(v,fmt){
  if(v==null||isNaN(v)) return '—';
  if(fmt==='$') return hcFmtK(v);
  if(fmt==='$full') return hcFmtFull(v);
  if(fmt==='%') return (Math.round(v*10)/10)+'%';

/* green = meeting the target, amber = within 10%, red = further off. */
function hcPlanTone(value,target,dir){
  if(target==null||target===''||isNaN(parseFloat(target))) return null;
  if(value==null||isNaN(value)) return null;
  const t=parseFloat(target);
  if(dir==='up'){
    if(value>=t) return 'var(--green)';
    if(t>0 && value>=t*0.9) return 'var(--amber)';
    return 'var(--red)';
  }
  if(value<=t) return 'var(--green)';
  if(t>0 && value<=t*1.1) return 'var(--amber)';
  return 'var(--red)';
}
